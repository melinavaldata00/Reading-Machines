<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Machines</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .docs-link{
      position:fixed;
      bottom:20px;
      right:20px;
      font-size:12px;
      letter-spacing:.04em;
      text-transform:uppercase;
      color:#1f130d;
      opacity:1;
      text-decoration:none;
      z-index:90;
      font-family:"ABC Favorit", monospace;
      padding:9px 16px;
      border:1px solid #1f130d;
      border-radius:999px;
      background:#ffffff;
      transition:background .15s ease, color .15s ease, opacity .3s ease;
    }
    .docs-link:hover{
      background:#2bff00;
      color:#1f130d;
      border-color:#1f130d;
    }
    /* documentation is only relevant on the landing -- fades out once  */
    /* you've scrolled down into the tool pages, same gating mechanism  */
    /* used for the presenter's own fixed chrome, just inverted.        */
    body.in-presenter .docs-link{
      opacity:0;
      pointer-events:none;
    }
    @media(max-width:480px){
      .docs-link{ bottom:14px; right:14px; padding:8px 13px; font-size:11px; }
    }

    /* ════════════════════════════════════════════════════════════ */
    /* PRESENTER — the 4 tool pages, appended below the landing as    */
    /* normal scroll sections. Own --tp-* palette vars (namespaced,   */
    /* not --bg/--text) so they never collide with style.css's own    */
    /* --bg/--text, which the marquee landing already uses for its    */
    /* own, different, white/brown theme.                              */
    /* ════════════════════════════════════════════════════════════ */
    @font-face{
      font-family:"ABC Stefan";
      src:url('fonts/ABCStefan-Simple-Trial.otf') format('opentype');
    }
    @font-face{
      font-family:"Anti-Type";
      src:url('fonts/anti-ocr-2.otf') format('opentype');
      font-display:swap;
    }
    #presenter{
      --tp-bg:#170d03;
      --tp-text:#3fff00;
      --tp-text-dim:rgba(63,255,0,.3);
      --tp-text-faint:rgba(63,255,0,.15);
      position:relative;
      z-index:1;
    }
    #index-bar{
      position:fixed; left:24px; top:50%; transform:translateY(-50%);
      display:flex; flex-direction:column; gap:22px; z-index:250;
      opacity:0; pointer-events:none; transition:opacity .3s;
    }
    body.in-presenter #index-bar{ opacity:1; pointer-events:auto; }
    .index-num{
      background:none; border:none; color:var(--tp-text,#3fff00); font-family:"ABC Gaisyr", monospace;
      font-size:12px; letter-spacing:.1em; cursor:pointer; padding:0; opacity:.4; transition:opacity .2s, color .2s;
    }
    body.page-is-white .index-num{ color:#1f130d; }
    .index-num:hover{ opacity:.8; }
    .index-num.active{ opacity:1; }
    .open-tool, .open-page{
      display:inline-block; margin-top:14px; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
      color:var(--tp-text,#3fff00); opacity:1; cursor:pointer; background:none; border:1px solid var(--tp-text,#3fff00);
      border-radius:14px; font-family:inherit; padding:8px 16px; text-decoration:none; transition:background .2s, color .2s;
    }
    .open-tool:hover, .open-page:hover{ background:var(--tp-text,#3fff00); color:var(--tp-bg,#170d03); }
    body.page-is-white .open-page{ color:#1f130d; border-color:#1f130d; }
    body.page-is-white .open-page:hover{ background:#1f130d; color:#ffffff; }
    #tool-overlay{
      --ov-bg:#ffffff; --ov-text:#1f130d; --ov-text-dim:rgba(31,19,13,.45);
      position:fixed; left:0; right:0; bottom:0; top:170px; z-index:300;
      background:var(--ov-bg); color:var(--ov-text); border-top:1px solid var(--ov-text-dim);
      transform:translateY(100%); transition:transform .5s cubic-bezier(.65,0,.35,1); pointer-events:none;
    }
    #tool-overlay.show{ transform:translateY(0); pointer-events:auto; }
    #tool-overlay-bar{
      position:absolute; top:0; left:0; right:0; height:34px; display:flex; align-items:center;
      justify-content:space-between; gap:14px; padding:0 14px; z-index:5; pointer-events:none;
    }
    #tool-overlay-bar > *{ pointer-events:auto; }
    #tool-overlay-title{ font-size:10px; letter-spacing:.04em; color:var(--ov-text-dim); }
    #tool-guide-btn{
      background:none; border:none; color:var(--ov-text-dim); font-family:inherit; font-size:11px;
      letter-spacing:.05em; cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:2px;
      opacity:.85; transition:opacity .2s, color .2s;
    }
    #tool-guide-btn:hover{ opacity:1; color:var(--ov-text); }
    #tool-guide-btn:disabled{ opacity:.3; pointer-events:none; }
    #tool-overlay-close{
      background:none; border:1px solid var(--ov-text-dim); border-radius:14px; color:var(--ov-text);
      font-family:inherit; font-size:11px; letter-spacing:.08em; cursor:pointer; padding:6px 10px;
      opacity:.7; transition:opacity .2s, background .2s, color .2s, border-color .2s;
    }
    #tool-overlay-close:hover{ opacity:1; background:#2bff00; color:#1f130d; border-color:#2bff00; }
    #tool-overlay-iframe{ position:absolute; top:34px; left:0; right:0; bottom:0; border:none; width:100%; height:calc(100% - 34px); }
    #anti-type-iframe{ position:absolute; top:34px; left:0; right:0; bottom:0; border:none; width:100%; height:calc(100% - 34px); display:none; }
    #anti-type-iframe.show{ display:block; }
    #anti-type-iframe.show ~ #tool-overlay-iframe{ display:none; }

    .tool-page{
      position:relative; min-height:100vh; display:flex; flex-direction:column; justify-content:center;
      padding:0 90px; background:var(--tp-bg); color:var(--tp-text);
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    .tp-head{ display:flex; align-items:baseline; gap:16px; margin-bottom:34px; }
    .tp-num{ font-family:"ABC Gaisyr", monospace; font-size:13px; letter-spacing:.15em; color:var(--tp-text-dim); }
    .tp-title{ font-family:"ABC Gaisyr", monospace; font-size:30px; letter-spacing:.03em; font-weight:400; }
    .tp-text{ font-family:"ABC Favorit", monospace; font-size:19px; line-height:1.55; }
    @keyframes tpFadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
    .tool-page.in-view .tp-head{ animation:tpFadeUp .5s ease both; }

    /* ---- 01 OCR Skeleton ---- */
    .tool-page.tp-float{ --tp-bg:#ffffff; padding:0; overflow:hidden; justify-content:flex-start; background:var(--tp-bg); }
    .tp-float .tp-head{ position:absolute; top:40px; left:24px; z-index:2; margin:0; }
    .tp-float .tp-title{
      display:block; font-family:"ABC Favorit", Helvetica, Arial, sans-serif; font-size:clamp(48px, 9vw, 120px);
      font-weight:400; line-height:.92; letter-spacing:-.02em; color:#1f130d;
    }
    .tp-float .tp-text{ position:absolute; inset:0; }
    .ocr-box{
      position:absolute; border:1px solid var(--tp-text-dim); padding:.55em .85em; line-height:1.3;
      max-width:min(60vw, 360px); background:var(--tp-bg); opacity:0; pointer-events:none; cursor:default;
      transition:opacity .6s ease, border-color .2s ease, background .2s ease, color .2s ease;
    }
    .ocr-box.visible{ opacity:1; pointer-events:auto; animation:var(--floatAnim) var(--fdur) ease-in-out infinite alternate; }
    .ocr-box.clickable{ border-color:var(--tp-text); cursor:pointer; }
    .ocr-box.clickable:hover{ background:var(--tp-text); color:var(--tp-bg); }
    @keyframes boxFloatDown{ from{ transform:translateY(calc(-1 * var(--famp))); } to{ transform:translateY(var(--famp)); } }
    @keyframes boxFloatUp{ from{ transform:translateY(var(--famp)); } to{ transform:translateY(calc(-1 * var(--famp))); } }

    /* ---- 02 Blind Contour — redaction bars, reveal on hover, drop back ---- */
    .tool-page.tp-bc-exaggerate{ padding:0; overflow:hidden; }
    .tp-bc-exaggerate .tp-head{ position:absolute; top:40px; left:24px; z-index:2; margin:0; }
    .tp-bc-exaggerate .tp-title{
      display:block; font-family:"ABC Favorit", Helvetica, Arial, sans-serif; font-size:clamp(48px, 9vw, 120px);
      font-weight:400; line-height:.92; letter-spacing:-.02em; color:var(--tp-text);
    }
    .tp-bc-exaggerate .tp-text{
      position:absolute; inset:0; display:flex; flex-wrap:wrap; align-content:center;
      gap:14px 34px; padding:220px 90px 60px 24px;
    }
    .bc-word{ position:relative; display:inline-block; cursor:pointer; animation:tpFadeUp .45s ease both; }
    .bc-label{
      display:inline-block; font-family:"ABC Favorit", monospace; font-size:clamp(38px, 6.6vw, 92px);
      line-height:1.15; color:var(--tp-text); white-space:nowrap;
    }
    .bc-bar{
      position:absolute; inset:-8% -5%; background:var(--tp-text); border-radius:1px;
      transform:rotate(var(--btilt, 0deg)) translateY(0) scaleY(1); transform-origin:center;
      opacity:1; pointer-events:none; transition:transform .4s cubic-bezier(.65,0,.35,1), opacity .3s ease .1s;
    }
    .bc-word.revealed .bc-bar{ transform:rotate(var(--btilt, 0deg)) translateY(-140%) scaleY(.85); opacity:0; }

    /* ---- 03 Anti Type ---- */
    .tp-float.tp-anti-write .tp-text{ position:static; inset:auto; }
    .at-panel{ margin:240px 90px 60px 24px; }
    .at-body{
      font-family:"Anti-Type", monospace; font-size:clamp(40px, 6.5vw, 84px); line-height:1.3;
      color:#1f130d; white-space:pre-wrap; word-wrap:break-word; cursor:text;
    }
    .at-content[contenteditable="true"]{ outline:none; }
    .at-cursor{ display:inline-block; margin-left:2px; color:#1f130d; animation:atBlink 1s step-end infinite; }
    @keyframes atBlink{ 0%, 100%{ opacity:1; } 50%{ opacity:0; } }

    /* ---- 04 Reading Loop ---- */
    .tool-page.tp-rl-camera{
      --tp-bg:#3fff00; --tp-text:#1f130d; --tp-text-dim: rgba(31,19,13,.45); --tp-text-faint: rgba(31,19,13,.22);
      padding:0; overflow:hidden; background:var(--tp-bg);
    }
    .tp-rl-camera .tp-head{ position:absolute; top:40px; left:24px; z-index:2; margin:0; }
    .tp-rl-camera .tp-title{
      display:block; font-family:"ABC Favorit", Helvetica, Arial, sans-serif; font-size:clamp(48px, 9vw, 120px);
      font-weight:400; line-height:.92; letter-spacing:-.02em; color:#1f130d;
    }
    .tp-rl-camera .tp-text{ position:absolute; inset:0; }
    .rl-viewport{ position:absolute; inset:0; overflow:hidden; }
    .rl-world{ position:absolute; top:0; left:0; right:0; will-change:transform; transition:transform 1.1s cubic-bezier(.65,0,.35,1); }
    .rl-row{ position:absolute; left:0; width:100%; height:0; }
    .rl-word{
      position:absolute; white-space:nowrap; font-family:"ABC Favorit", monospace;
      font-size:15px; line-height:1.3; color:var(--tp-text-dim);
      opacity:.32; transition:opacity .6s ease;
    }
    .rl-word.decoy{ opacity:.3; }
    .rl-word.selected{
      background:var(--tp-text); color:var(--tp-bg);
      padding:2px 7px; border-radius:2px; opacity:1; font-weight:500;
    }

    #btn-next{ position:fixed; bottom:18px; right:22px; z-index:250; opacity:0; pointer-events:none; transition:opacity .3s; }
    #btn-go-tool{ position:fixed; bottom:18px; left:24px; z-index:250; opacity:0; pointer-events:none; transition:opacity .3s; }
    body.in-presenter #btn-next, body.in-presenter #btn-go-tool{ opacity:1; pointer-events:auto; }

    @media(max-width:800px){
      .tool-page{ padding:0 24px; }
    }
  </style>
</head>
<body>

  <main class="landing">

    <section class="panel">
      <div class="viewport">
        <div class="marquee" id="human">
          <div class="content"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="viewport">
        <div class="marquee" id="machine">
          <div class="content"></div>
        </div>
      </div>
    </section>

  </main>

  <a href="https://melinavaldata00.github.io/RMDocumentation/" class="docs-link" target="_blank" rel="noopener">DOCUMENTATION</a>

  <script src="script.js"></script>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- PRESENTER — the 4 tool pages, continuing the same scroll below   -->
  <!-- the landing marquee instead of living on a separate page.        -->
  <!-- ══════════════════════════════════════════════════════════════ -->

  <div id="tool-overlay">
    <div id="tool-overlay-bar">
      <span id="tool-overlay-title">—</span>
      <button id="tool-guide-btn" disabled>how does it work?</button>
      <button id="tool-overlay-close">✕ close</button>
    </div>
    <iframe id="anti-type-iframe" src="" title="Anti Type"></iframe>
    <iframe id="tool-overlay-iframe" src="" title="tool"></iframe>
  </div>

  <div id="index-bar">
    <button class="index-num active" data-idx="0">01</button>
    <button class="index-num" data-idx="1">02</button>
    <button class="index-num" data-idx="2">03</button>
    <button class="index-num" data-idx="3">04</button>
  </div>

  <div id="presenter">

    <section class="tool-page tp-float" data-idx="0" data-tool-src="tools/position-zero.html" data-tool-name="OCR Skeleton">
      <div class="tp-head">
        <span class="tp-title">OCR Skeleton</span>
      </div>
      <div class="tp-text" data-style="floatboxes" data-text="Before recognizing a single letter, an OCR system does something simpler first: it figures out [[where something might be written.]] [[The page is divided]] into rectangles, bounding boxes, drawn around clusters of dark pixels the system thinks could be words. Only after that does it try to guess what each word actually says, along with a number for how confident it is about that guess."></div>
    </section>

    <section class="tool-page tp-bc-exaggerate" data-idx="1" data-tool-src="tools/outline.html" data-tool-name="Blind Contour">
      <div class="tp-head">
        <span class="tp-title">Blind Contour</span>
      </div>
      <div class="tp-text" data-style="abstract-words" data-text="The machine keeps only the shapes it recognizes as writing and discards the rest as noise, handing back pure outline — a contour you can scale, rotate, or trust exactly as much as it does."></div>
    </section>

    <section class="tool-page tp-float tp-anti-write" data-idx="2" data-tool-src="tools/anti-ocr.html" data-tool-name="Anti Type">
      <div class="tp-head">
        <span class="tp-title">Anti Type</span>
      </div>
      <div class="tp-text" data-style="antitype-write" data-text="Every letter has a point at which a machine stops recognizing it. Not because the shape has disappeared, it is still there visible to a human eye, but because enough of its detail has been removed that the system can no longer produce a confident guess about what it is."></div>
    </section>

    <section class="tool-page tp-rl-camera" data-idx="3" data-tool-src="tools/co-read.html" data-tool-name="Reading Loop">
      <div class="tp-head">
        <span class="tp-title">Reading Loop</span>
      </div>
      <div class="tp-text" data-style="camera-links" data-text="what happens when a machine reads what is left from its previous reading? The tool takes an image as input and runs it through OCR, producing a typeset document — each word placed, sized, and positioned according to what the system found."></div>
    </section>

  </div>

  <button id="btn-go-tool" class="open-page">open tool →</button>
  <button id="btn-next" class="open-page">next →</button>

  <script>

  /* ------------------------------ */
  /* SEEDED RANDOM (presenter's own copy — script.js has one too, but     */
  /* scoped separately since both files declare it at top level)          */
  /* ------------------------------ */

  function tpSeededRandom(seed){
      let s = Math.sin(seed) * 10000;
      return s - Math.floor(s);
  }

  /* ------------------------------ */
  /* READING SYSTEMS — one bespoke visual treatment per tool page, each    */
  /* built from the same plain data-text string.                            */
  /* ------------------------------ */

  let wrapCounter = 0;

  // keyed by page index — lets a reading system run something (like Anti
  // Type's typing effect) only while its page is actually on screen.
  const pageHooks = {};

  // 01 OCR Skeleton — the text is chunked into groups of 1-3 words, each one
  // living inside a floating box of its own size, drifting slowly up or down.
  // Only the first box starts visible; clicking a box reveals the next one,
  // placed elsewhere in the space — the guesses arrive one at a time.
  function wrapFloatBoxes(block){
      const raw = block.dataset.text.replace(/\s+/g, ' ').trim();
      const blockIdx = wrapCounter++;

      const units = [];
      const forcedRe = /\[\[(.*?)\]\]/g;
      let lastIndex = 0, m;
      const pushWords = str=>{
          str.trim().split(' ').filter(Boolean).forEach(w=> units.push({ t: w, forced: false }));
      };
      while((m = forcedRe.exec(raw))){
          pushWords(raw.slice(lastIndex, m.index));
          units.push({ t: m[1].trim(), forced: true });
          lastIndex = forcedRe.lastIndex;
      }
      pushWords(raw.slice(lastIndex));

      const chunks = [];
      let ui = 0, gi = 0;

      if(units.length){
          if(units[0].forced){
              chunks.push(units[0].t);
              ui = 1;
          } else {
              const take = [];
              while(ui < units.length && !units[ui].forced && take.length < 2){
                  take.push(units[ui].t); ui++;
              }
              chunks.push(take.join(' '));
          }
      }

      while(ui < units.length){
          if(units[ui].forced){
              chunks.push(units[ui].t);
              ui++;
              continue;
          }
          const size = 2 + Math.floor(tpSeededRandom(blockIdx*1000 + gi) * 2);
          const take = [];
          while(ui < units.length && !units[ui].forced && take.length < size){
              take.push(units[ui].t); ui++;
          }
          chunks.push(take.join(' '));
          gi++;
      }

      if(chunks.length > 1 && chunks[chunks.length - 1].split(' ').length < 2){
          const last = chunks.pop();
          chunks[chunks.length - 1] += ' ' + last;
      }

      const boxes = chunks.map((chunk, ci)=>{
          const box = document.createElement("div");
          box.className = "ocr-box";
          box.textContent = chunk;

          const seed = blockIdx*1000 + ci;
          const left  = 6  + tpSeededRandom(seed + 0.1) * 68;
          const top   = 10 + tpSeededRandom(seed + 0.2) * 64;
          const fsize = 14 + tpSeededRandom(seed + 0.3) * 18;
          const fdur  = 4.5 + tpSeededRandom(seed + 0.4) * 4.5;
          const famp  = 26 + tpSeededRandom(seed + 0.5) * 64;
          const goingDown = tpSeededRandom(seed + 0.6) > 0.5;

          box.style.left = left.toFixed(1) + "%";
          box.style.top  = top.toFixed(1) + "%";
          box.style.fontSize = fsize.toFixed(1) + "px";
          box.style.setProperty("--fdur", fdur.toFixed(2) + "s");
          box.style.setProperty("--famp", famp.toFixed(1) + "px");
          box.style.setProperty("--floatAnim", goingDown ? "boxFloatDown" : "boxFloatUp");

          block.appendChild(box);
          return box;
      });

      function revealBox(ci){
          const box = boxes[ci];
          box.classList.add("visible");
          if(ci < boxes.length - 1){
              box.classList.add("clickable");
              box.addEventListener("click", ()=>{
                  if(box.dataset.used) return;
                  box.dataset.used = "1";
                  box.classList.remove("clickable");
                  revealBox(ci + 1);
              });
          }
      }

      if(boxes.length) revealBox(0);
  }

  // 02 Blind Contour — each word sits under a solid redaction bar, the same
  // colour as the text, stamped on at a small seeded tilt so the row doesn't
  // look machine-uniform. Hovering lifts the bar away and reveals the word;
  // a few seconds later — automatically, regardless of whether the mouse is
  // still there — it drops back down and covers the word again.
  function wrapAbstractWords(block){
      const text = block.dataset.text.replace(/\s+/g, ' ').trim();
      const blockIdx = wrapCounter++;
      const words = text.split(' ');
      const REVEAL_MS = 2500;

      words.forEach((word, wi)=>{
          const wrap = document.createElement("span");
          wrap.className = "bc-word";
          wrap.style.animationDelay = (wi * 0.04).toFixed(3) + 's';

          const label = document.createElement("span");
          label.className = "bc-label";
          label.textContent = word;

          const bar = document.createElement("span");
          bar.className = "bc-bar";
          const seed = blockIdx*1000 + wi;
          const tilt = (tpSeededRandom(seed + 0.6) - 0.5) * 3.6;
          bar.style.setProperty("--btilt", tilt.toFixed(2) + "deg");

          wrap.appendChild(label);
          wrap.appendChild(bar);

          let revealTimer = null;
          wrap.addEventListener("mouseenter", ()=>{
              wrap.classList.add("revealed");
              clearTimeout(revealTimer);
              revealTimer = setTimeout(()=> wrap.classList.remove("revealed"), REVEAL_MS);
          });

          block.appendChild(wrap);
          block.appendChild(document.createTextNode(" "));
      });
  }

  // 03 Anti Type — a plain text-file panel where the description types
  // itself out letter by letter, set in the real exported Anti-Type font,
  // with a blinking cursor. Clicking the text hands over the keyboard;
  // pausing hands it back. Returns { start, stop }.
  function wrapAntiTypeWrite(block){
      const text = block.dataset.text;
      block.innerHTML = "";

      const panel = document.createElement("div");
      panel.className = "at-panel";

      const body = document.createElement("div");
      body.className = "at-body";
      const content = document.createElement("span");
      content.className = "at-content";
      const cursor = document.createElement("span");
      cursor.className = "at-cursor";
      cursor.textContent = "|";
      body.appendChild(content);
      body.appendChild(cursor);
      panel.appendChild(body);

      block.appendChild(panel);

      let timer     = null;
      let idleTimer = null;
      let i         = 0;
      let editing   = false;
      const IDLE_DELAY = 1400;

      function stopTyping(){
          if(timer){ clearInterval(timer); timer = null; }
      }

      function clearIdle(){
          if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
      }

      function resumeAuto(){
          editing = false;
          content.contentEditable = "false";
          cursor.style.display = "";
          stopTyping();
          timer = setInterval(()=>{
              if(i >= text.length){ stopTyping(); return; }
              content.appendChild(document.createTextNode(text[i]));
              i++;
          }, 130);
      }

      function scheduleResume(){
          clearIdle();
          idleTimer = setTimeout(resumeAuto, IDLE_DELAY);
      }

      function beginEditing(){
          clearIdle();
          if(editing) return;
          editing = true;
          stopTyping();
          cursor.style.display = "none";
          content.contentEditable = "true";
          content.spellcheck = false;
          content.focus();
          const range = document.createRange();
          range.selectNodeContents(content);
          range.collapse(false);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
      }

      body.addEventListener("click", beginEditing);
      content.addEventListener("input", scheduleResume);

      function start(){
          clearIdle();
          stopTyping();
          editing = false;
          content.contentEditable = "false";
          cursor.style.display = "";
          content.textContent = "";
          i = 0;
          timer = setInterval(()=>{
              if(i >= text.length){ stopTyping(); return; }
              content.textContent += text[i];
              i++;
          }, 130);
      }

      function stop(){
          clearIdle();
          stopTyping();
      }

      return { start, stop };
  }

  // 04 Reading Loop — a growing word-association cascade: one short
  // PHRASE per row is "selected" (solid box) because it's the real
  // continuation of the previous selected phrase somewhere in the
  // source text -- a tiny, literal model of the machine "making a
  // connection". The rest of the row is filled with other short phrases
  // pulled at random from the same text, left at a dimmer, unboxed
  // opacity, standing in for the other paths the system could have
  // taken but didn't. Rows keep growing on a timer, the camera pans
  // down to follow the newest one, and once it's grown enough it clears
  // and starts again -- the loop the tool is named for.
  // Returns { start, stop }.
  function wrapCameraLinks(block){
      const raw = block.dataset.text.replace(/\s+/g, ' ').trim();
      const blockIdx = wrapCounter++;

      const tokens = raw.toLowerCase().replace(/[^a-z0-9'\-\s]/g, '').split(/\s+/).filter(Boolean);
      const vocab = Array.from(new Set(tokens));

      // index every position a word occurs at, so a "connection" can
      // jump to any real occurrence of the current word and continue
      // with whatever actually follows it in the text -- multiple words
      // at once, not just one at a time, so each step reads as a small
      // phrase instead of an isolated, hard-to-parse token.
      const occurrences = {};
      tokens.forEach((t, i)=> (occurrences[t] || (occurrences[t] = [])).push(i));

      function phraseAt(startIdx, len){
          return tokens.slice(startIdx, startIdx + len).join(' ') || tokens[0];
      }

      // the selected phrase continues from a real occurrence of the
      // current word -- PHRASE_LEN words long, taken verbatim from the text.
      function pickNextPhrase(word, seed){
          const occ = occurrences[word];
          let startIdx;
          if(occ && occ.length){
              const at = occ[Math.floor(tpSeededRandom(seed) * occ.length)] + 1;
              startIdx = at < tokens.length ? at : 0;
          } else {
              startIdx = Math.floor(tpSeededRandom(seed) * tokens.length);
          }
          const len = 3 + Math.floor(tpSeededRandom(seed + 0.31) * 3); // 3–5 words
          return phraseAt(startIdx, len);
      }

      // a decoy phrase is just some other random stretch of the same
      // text -- unrelated to the current word, but still real, readable
      // language rather than a single loose word.
      function pickDecoyPhrase(seed){
          const startIdx = Math.floor(tpSeededRandom(seed) * tokens.length);
          const len = 2 + Math.floor(tpSeededRandom(seed + 0.17) * 3); // 2–4 words
          return phraseAt(startIdx, len);
      }

      block.innerHTML = "";
      const viewport = document.createElement("div");
      viewport.className = "rl-viewport";
      const world = document.createElement("div");
      world.className = "rl-world";
      viewport.appendChild(world);
      block.appendChild(viewport);

      const ROW_H = 56;
      const ROW_DELAY = 1500;
      const MAX_ROWS = 18;

      let rowIndex = 0;
      let currentWord = vocab[0] || "reading";
      let autoTimer = null;
      let running = false;

      function growRow(){
          const vpWidth = viewport.getBoundingClientRect().width || 600;
          const seedBase = blockIdx*100000 + rowIndex*97;
          const row = document.createElement("div");
          row.className = "rl-row";
          row.style.top = (rowIndex * ROW_H) + "px";

          const count = 2 + Math.floor(tpSeededRandom(seedBase) * 2); // 2–3 phrases per row
          const selPos = Math.floor(tpSeededRandom(seedBase + 1) * count);
          const nextPhrase = pickNextPhrase(currentWord, seedBase + 2);

          for(let i=0; i<count; i++){
              const isSelected = i === selPos;
              const seed = seedBase + i*3 + 10;
              const phrase = isSelected ? nextPhrase : pickDecoyPhrase(seed);

              const w = document.createElement("span");
              w.textContent = phrase;
              w.className = "rl-word " + (isSelected ? "selected" : "decoy");
              if(!isSelected && tpSeededRandom(seed + 0.5) > 0.55){ w.style.fontStyle = "italic"; }

              const x = (i / count) * vpWidth + tpSeededRandom(seed + 0.7) * (vpWidth / count) * 0.4 + 24;
              const y = tpSeededRandom(seed + 0.9) * 18 - 9;
              w.style.left = x.toFixed(1) + "px";
              w.style.top  = y.toFixed(1) + "px";

              row.appendChild(w);
          }

          world.appendChild(row);
          // keep the chain going from the last word of whatever phrase
          // was actually selected this row.
          const nextWords = nextPhrase.split(' ');
          currentWord = nextWords[nextWords.length - 1] || currentWord;
          rowIndex++;

          const vpHeight = viewport.getBoundingClientRect().height || 400;
          const ty = vpHeight/2 - (rowIndex * ROW_H);
          world.style.transform = "translate(0, " + ty.toFixed(1) + "px)";

          if(!running) return;
          if(rowIndex >= MAX_ROWS){
              autoTimer = setTimeout(resetLoop, ROW_DELAY * 1.6);
          } else {
              autoTimer = setTimeout(growRow, ROW_DELAY);
          }
      }

      function resetLoop(){
          if(!running) return;
          world.style.transition = "none";
          world.innerHTML = "";
          rowIndex = 0;
          currentWord = vocab[0] || "reading";
          world.style.transform = "translate(0, 0)";
          void world.offsetHeight; // force reflow so the next pan still transitions
          world.style.transition = "";
          autoTimer = setTimeout(growRow, ROW_DELAY);
      }

      function start(){
          running = true;
          resetLoop();
      }

      function stop(){
          running = false;
          clearTimeout(autoTimer);
      }

      return { start, stop };
  }

  function renderReadingSystem(block){
      switch(block.dataset.style){
          case "floatboxes": wrapFloatBoxes(block); break;
          case "abstract-words": wrapAbstractWords(block); break;
          case "antitype-write": {
              const hooks = block.closest(".tool-page").dataset.idx;
              pageHooks[hooks] = wrapAntiTypeWrite(block);
              break;
          }
          case "camera-links": {
              const idx = block.closest(".tool-page").dataset.idx;
              pageHooks[idx] = wrapCameraLinks(block);
              break;
          }
      }
  }

  document.querySelectorAll(".tp-text").forEach(renderReadingSystem);

  /* ------------------------------ */
  /* PAGE STATE — scroll-driven instead of click-only. An IntersectionObs- */
  /* erver watches all 4 tool pages; whichever one crosses the middle of   */
  /* the viewport becomes "current": its reading-system hook starts (the   */
  /* previous one's stops), the index-bar dot updates, and the fixed       */
  /* controls flip between the green-on-dark and brown-on-light palette.   */
  /* NEXT and the index dots still work — they just scroll to the target   */
  /* section instead of instantly swapping a display:none flag.            */
  /* ------------------------------ */

  const pages     = Array.from(document.querySelectorAll(".tool-page"));
  const indexBtns = Array.from(document.querySelectorAll(".index-num"));
  let currentPage = 0;

  function setCurrentPage(idx){
      const prevPage = currentPage;
      currentPage = idx;
      pages.forEach((p, i)=> p.classList.toggle("in-view", i === currentPage));
      indexBtns.forEach((b, i)=> b.classList.toggle("active", i === currentPage));
      document.body.classList.toggle("page-is-white",
          pages[currentPage].classList.contains("tp-float") ||
          pages[currentPage].classList.contains("tp-rl-camera")
      );
      if(prevPage !== currentPage){
          if(pageHooks[prevPage]) pageHooks[prevPage].stop();
          if(pageHooks[currentPage]) pageHooks[currentPage].start();
      }
  }

  const pageObserver = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
          if(entry.isIntersecting && entry.intersectionRatio >= 0.5){
              const idx = pages.indexOf(entry.target);
              if(idx !== -1) setCurrentPage(idx);
          }
      });
  }, { threshold: [0.5] });
  pages.forEach(p=> pageObserver.observe(p));

  // fixed presenter chrome (index-bar, next, go-to-tool) stays hidden
  // while on the landing, fades in once you've scrolled off it -- also
  // used by style.css to fade out the landing's own STATE/column-toggle
  // chrome in reverse. Watches .landing itself (a real, full-height
  // element) via isIntersecting rather than a zero-height sentinel div
  // compared against boundingClientRect -- the sentinel had no area, so
  // browsers weren't reliably re-firing the callback on the way back up,
  // leaving in-presenter stuck on once you'd scrolled past it once.
  const landingEl = document.querySelector(".landing");
  const presenterObserver = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
          document.body.classList.toggle("in-presenter", !entry.isIntersecting);
      });
  }, { threshold: [0] });
  presenterObserver.observe(landingEl);

  /* ------------------------------ */
  /* SECTION-JUMP SCROLL — the whole page (landing, then the 4 tool        */
  /* pages) advances in whole-section jumps: each wheel gesture moves      */
  /* straight to the next/previous section instead of scrolling gradually  */
  /* through it. A short cooldown after each jump swallows the extra       */
  /* wheel events one trackpad swipe fires, so one gesture = one section.  */
  /* NEXT and the index dots go through the same jumpTo(), so every way of */
  /* moving through the site stays in sync.                                */
  /* ------------------------------ */

  const allSections = [document.querySelector(".landing"), ...pages];
  let sectionIndex = 0;
  let jumping = false;
  let jumpCooldown = null;

  // explicit initial sync -- if the page loads already scrolled down
  // (e.g. the browser restoring your previous scroll position on a
  // refresh), don't rely solely on the observers' first async callback
  // to get body.in-presenter / the active page right; check directly,
  // synchronously, against where the page actually is right now.
  function syncScrollState(){
      const lr = landingEl.getBoundingClientRect();
      const landingVisible = lr.bottom > 0 && lr.top < window.innerHeight;
      document.body.classList.toggle("in-presenter", !landingVisible);
      sectionIndex = landingVisible ? 0 : 1 + currentPage;

      pages.forEach((p, i)=>{
          const r = p.getBoundingClientRect();
          const mid = window.innerHeight / 2;
          if(r.top <= mid && r.bottom >= mid){
              setCurrentPage(i);
              sectionIndex = 1 + i;
          }
      });
  }
  syncScrollState();
  window.addEventListener("load", syncScrollState);

  function jumpTo(idx){
      idx = Math.max(0, Math.min(allSections.length - 1, idx));
      sectionIndex = idx;
      // set in-presenter synchronously, the moment we decide to jump --
      // don't wait for the IntersectionObserver to confirm the scroll
      // landed, since with scroll-snap + smooth scrollIntoView fighting
      // over the same scroll position, the observer doesn't always fire
      // reliably in real browsers (this was the actual cause of
      // documentation still showing on a tool page: jumpTo() is the only
      // way scroll position ever changes here -- wheel is fully
      // intercepted -- so we already know deterministically which
      // section we're headed to, no need to measure anything).
      document.body.classList.toggle("in-presenter", idx > 0);
      if(idx > 0) setCurrentPage(idx - 1);
      // close the open-tool overlay on any section jump, even if the
      // user didn't hit the close button -- scrolling away should feel
      // like leaving the tool, not leaving it open behind the new page.
      if(typeof closeToolOverlay === "function") closeToolOverlay();
      jumping = true;
      allSections[idx].scrollIntoView({ behavior: "smooth", block: "start" });
      clearTimeout(jumpCooldown);
      jumpCooldown = setTimeout(()=>{ jumping = false; }, 900);
  }

  function handleWheel(e){
      e.preventDefault();
      if(jumping) return;
      if(e.deltaY > 10) jumpTo(sectionIndex + 1);
      else if(e.deltaY < -10) jumpTo(sectionIndex - 1);
  }

  window.addEventListener("wheel", handleWheel, { passive:false });

  document.getElementById("btn-next").addEventListener("click", ()=>{
      const next = (currentPage + 1) % pages.length;
      jumpTo(1 + next);
  });

  indexBtns.forEach(btn=>{
      btn.addEventListener("click", ()=>{
          const idx = parseInt(btn.dataset.idx, 10);
          jumpTo(1 + idx);
      });
  });

  document.getElementById("btn-go-tool").addEventListener("click", ()=>{
      const p = pages[currentPage];
      openTool(p.dataset.toolSrc, p.dataset.toolName);
  });

  /* ------------------------------ */
  /* TOOL OVERLAY */
  /* ------------------------------ */

  const toolOverlay      = document.getElementById("tool-overlay");
  const toolOverlayFrame = document.getElementById("tool-overlay-iframe");
  const antiTypeFrame    = document.getElementById("anti-type-iframe");
  const toolOverlayTitle = document.getElementById("tool-overlay-title");
  const ANTI_TYPE_SRC    = "tools/anti-ocr.html";

  function openTool(src, name){
      if(src === ANTI_TYPE_SRC){
          if(!antiTypeFrame.dataset.loaded){
              antiTypeFrame.src = src;
              antiTypeFrame.dataset.loaded = "1";
          }
          antiTypeFrame.classList.add("show");
          if(typeof Notification !== "undefined" && Notification.permission === "default"){
              Notification.requestPermission();
          }
          clearAntiTypeUpdateFlag();
      } else {
          antiTypeFrame.classList.remove("show");
          if(toolOverlayFrame.dataset.currentSrc !== src){
              toolOverlayFrame.src = src;
              toolOverlayFrame.dataset.currentSrc = src;
          }
      }

      toolOverlayTitle.textContent = name;
      toolOverlay.classList.add("show");
      document.getElementById("tool-guide-btn").disabled = false;
  }

  document.getElementById("tool-guide-btn").addEventListener("click", ()=>{
      const activeFrame = antiTypeFrame.classList.contains("show") ? antiTypeFrame : toolOverlayFrame;
      if(!activeFrame.contentWindow) return;
      activeFrame.contentWindow.postMessage({ type: "open-guide" }, location.origin);
  });

  const pageTitle = document.title;

  function clearAntiTypeUpdateFlag(){
      document.title = pageTitle;
  }

  window.addEventListener("message", (event)=>{
      if(event.origin !== location.origin) return;
      if(!event.data || event.data.type !== "anti-type-done") return;

      const { title, body } = event.data;

      if(typeof Notification !== "undefined" && Notification.permission === "granted"){
          try { new Notification(title, { body }); } catch(e) {}
      }

      document.title = "● " + pageTitle;
  });

  window.addEventListener("focus", ()=>{
      if(antiTypeFrame.classList.contains("show")) clearAntiTypeUpdateFlag();
  });

  // when the tool overlay is open, the mouse is sitting over its iframe --
  // wheel events fire on THAT document, not this one, so they never reach
  // handleWheel above and scrolling appeared to do nothing while a tool
  // was open. Attach the same handler inside each tool iframe too
  // (same-origin, so this is allowed) once it's loaded, so scrolling over
  // an open tool still jumps sections and closes the overlay along the way.
  function attachWheelToFrame(frame){
      try{
          if(frame.contentWindow){
              frame.contentWindow.addEventListener("wheel", handleWheel, { passive:false });
          }
      } catch(err){ /* cross-origin or not yet loaded -- ignore */ }
  }
  toolOverlayFrame.addEventListener("load", ()=> attachWheelToFrame(toolOverlayFrame));
  antiTypeFrame.addEventListener("load", ()=> attachWheelToFrame(antiTypeFrame));

  function closeToolOverlay(){
      toolOverlay.classList.remove("show");
      toolOverlayFrame.src = "";
      toolOverlayFrame.dataset.currentSrc = "";
      antiTypeFrame.classList.remove("show");
  }

  document.getElementById("tool-overlay-close").addEventListener("click", closeToolOverlay);

  </script>
</body>
</html>
