name: Keep Render server awake

# Pings the hosted CV server every 10 minutes so Render's free tier doesn't
# spin it down after inactivity — avoids the ~50s cold-start delay on the
# next real request from outline.html / anti-ocr.html.
#
# Note: GitHub disables scheduled workflows after 60 days without any
# commit activity in the repo. If pings stop working after a long pause,
# push any small commit (or re-enable the workflow from the Actions tab)
# to resume them.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://reading-machines.onrender.com/ || true
