<head>

<style>

@font-face {
  font-family: "ABC Gaisyr";
  src: url("./fonts/ABCGaisyrMono-Light-Trial.otf") format("opentype");
}

@font-face {
  font-family: "ABC Stefan";
  src: url("./fonts/ABCStefan-Simple-Trial.otf") format("opentype");
}

@font-face {
  font-family: "ABC Favorit";
  src: url("./fonts/ABCFavorit-Regular-Trial.otf") format("opentype");
  font-display: swap;
}

:root{
  --bg:#170d03;
  --text:#3fff00;
  --text-dim: rgba(63,255,0,.3);
  --text-faint: rgba(63,255,0,.15);
}

*{ margin:0; padding:0; box-sizing:border-box; }

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:"ABC Favorit", monospace;
  width:100%;
  height:100%;
  overflow:hidden;
}

#viewport{
  position:fixed;
  inset:0;
  overflow:hidden;
}

#world{
  position:absolute;
  top:0; left:0;
  width:6000px;
  height:4000px;
  will-change:transform;
}

/* publication isn't a tool — it lives outside the canvas/overlay      */
/* system entirely, reached instead through this persistent top-center   */
/* link, in the spot ENTER used to occupy before it moved to index.html. */
#publication-link{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  font-size:13px;
  letter-spacing:.2em;
  font-family:"ABC Gaisyr", monospace;
  color:var(--text);
  z-index:50;
  text-decoration:none;
  opacity:.85;
  transition:opacity .2s;
}

#publication-link:hover{
  opacity:.55;
}

#back-to-start{
  position:fixed;
  top:18px;
  left:24px;
  z-index:50;
  text-decoration:none;
  color:var(--text);
  opacity:.7;
  transition:opacity .2s;
  font-size:13px;
  gap:5px;
}

#back-to-start:hover{
  opacity:1;
}

#go-to-docs{
  position:fixed;
  right:22px;
  bottom:66px;
  z-index:50;
  text-decoration:none;
  color:var(--text);
  opacity:.7;
  transition:opacity .2s;
  font-size:13px;
  gap:5px;
}

#go-to-docs:hover{
  opacity:1;
}

#index-bar{
  position:fixed;
  left:24px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:22px;
  z-index:50;
}

.open-tool,
.open-page{
  display:inline-block;
  margin-top:14px;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--text);
  opacity:1;
  cursor:pointer;
  background:none;
  border:1px solid var(--text);
  border-radius:14px;
  font-family:inherit;
  padding:8px 16px;
  text-decoration:none;
  transition:background .2s, color .2s;
}

.open-tool:hover,
.open-page:hover{
  background:var(--text);
  color:var(--bg);
}

#tool-overlay{
  /* scoped white/brown override — the whole tool overlay (sidebar and     */
  /* the tool itself) reads white/brown while a tool is open; the canvas   */
  /* outside stays on the dark palette, since these vars only cascade to   */
  /* #tool-overlay's own descendants.                                      */
  --bg:#ffffff;
  --text:#1f130d;
  --text-dim: rgba(31,19,13,.45);
  --text-faint: rgba(31,19,13,.22);

  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  flex-direction:row;
  background:var(--bg);
  color:var(--text);
}

#tool-overlay.show{
  display:flex;
}

/* ---- left column: site nav + list of tools — sized to roughly       */
/* match the reference layout (softer-tools.space), about a third of    */
/* the screen, so the open tool reads as a page inside a proper           */
/* editorial frame instead of bleeding edge-to-edge across the whole      */
/* window.                                                                 */

#tool-sidebar{
  width:33%;
  min-width:300px;
  max-width:440px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--text-dim);
  padding:22px 22px 18px;
  gap:26px;
  overflow-y:auto;
}

#tool-sidebar-title{
  font-size:13px;
  letter-spacing:.2em;
  font-family:"ABC Gaisyr", monospace;
}

#tool-sidebar-hint{
  font-size:10px;
  letter-spacing:.05em;
  color:var(--text-dim);
  line-height:1.7;
}

#tool-list{
  display:flex;
  flex-direction:column;
  flex:1;
}

.tool-link{
  background:none;
  border:none;
  border-bottom:1px solid var(--text-faint);
  color:var(--text);
  font-family:"ABC Favorit", monospace;
  text-align:left;
  font-size:12px;
  letter-spacing:.05em;
  padding:10px 0;
  cursor:pointer;
  opacity:.6;
  transition:opacity .2s;
}

.tool-link:hover{
  opacity:.9;
}

.tool-num{
  display:inline-block;
}

.tool-label{
  display:inline-block;
  margin-left:6px;
  transition:transform .2s ease;
}

@keyframes tool-label-slide{
  0%   { transform:translateX(0); }
  100% { transform:translateX(14px); }
}

.tool-link:hover .tool-label{
  animation:tool-label-slide .7s ease-in-out infinite alternate;
}

.tool-link.active{
  opacity:1;
}

.tool-link.has-update{
  opacity:1;
}
.tool-link.has-update .tool-label::after{
  content:"";
  display:inline-block;
  width:6px; height:6px;
  border-radius:50%;
  background:#2bff00;
  margin-left:8px;
  vertical-align:middle;
}

#tool-overlay-close{
  background:none;
  border:1px solid var(--text-dim);
  border-radius:14px;
  color:var(--text);
  font-family:inherit;
  font-size:11px;
  letter-spacing:.08em;

  padding:6px 10px;
  opacity:.7;

  align-self:flex-start;
}

#tool-overlay-close:hover{

#tool-guide-btn{

  font-size:11px;

#tool-guide-btn:hover{

  background:#2bff00;
  color:#1f130d;
  border-color:#2bff00;
}

#tool-main{
  position:relative;
  flex:1;
  min-width:0;
  background:var(--bg);
}

/* the floating label sits in its own strip above the iframe now — each   */
/* tool page renders its own header flush with the iframe's top edge, so  */
/* without this reserved strip the two headers land on the same pixels    */
/* and garble together (this is the overlap bug: the label and the        */
/* tool's own in-page title were both drawn at top:10px/left:14px).       */
#tool-overlay-title{
  position:absolute;
  top:10px;
  left:14px;
  height:20px;
  font-size:10px;
  letter-spacing:.04em;
  color:var(--text-dim);
  z-index:5;
  pointer-events:none;
}

#tool-overlay-iframe{
  position:absolute;
  top:34px;
  left:0;
  right:0;
  bottom:0;
  border:none;
  width:100%;
  height:calc(100% - 34px);
}

/* Anti Type gets its own dedicated iframe that is never unloaded once     */
/* opened: font-loop requests can take a while, so switching to another    */
/* tool must not kill an in-progress run. It's just hidden (not removed)   */
/* while a different tool is shown, and keeps running underneath.          */
#anti-type-iframe{
  position:absolute;
  top:34px;
  left:0;
  right:0;
  bottom:0;
  border:none;
  width:100%;
  height:calc(100% - 34px);
  display:none;
}
#anti-type-iframe.show{ display:block; }
#anti-type-iframe.show ~ #tool-overlay-iframe{ display:none; }

  border:none;
  color:var(--text);

#hint{

  align-items:center;

  font-size:16px;
  letter-spacing:.1em;
  color:var(--text);
  z-index:51;
  pointer-events:none;
  opacity:0;
  transition:opacity 1s ease; /* only used going out, see .show below */
  background:rgba(23,13,3,.35);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

/* Blur is at full strength the instant .show is added — no fading in.  */
/* Removing .show falls back to the transition above, so it fades OUT.  */
#hint.show{
  opacity:1;
  transition:none;
}

<script>

/* ------------------------------ */
/* SEEDED RANDOM */
/* ------------------------------ */

function seededRandom(seed){
    let s = Math.sin(seed) * 10000;
    return s - Math.floor(s);
}

/* ------------------------------ */
/* WRAP LETTERS — riusabile anche per le note utente */
/* ------------------------------ */

let wrapCounter = 0;

function wrapText(block){

    const text = block.dataset.text;
    const blockIdx = wrapCounter++;
    let i = 0;

    // Type | anywhere inside data-text to force a manual line break there.
    const lines = text.split("|");

    lines.forEach((line, li)=>{

        const lineEl = document.createElement("div");
        lineEl.className = "frag-line";

        // Letters are grouped into a per-word wrapper so the browser only
        // ever breaks the line between words (at a real space character)
        // — never in the middle of one. Each .word is a plain inline span
        // with no whitespace between its letter children, so it can't
        // split internally.
        const words = line.split(" ");

        words.forEach((word, wi)=>{

            const wordSpan = document.createElement("span");
            wordSpan.className = "word";

            word.split("").forEach(ch=>{

                const span = document.createElement("span");
                span.className = "letter";
                span.textContent = ch;
                span.dataset.char = ch;

                const seed = blockIdx*1000 + i++;

                const dx = (seededRandom(seed)       - 0.5) * 260;
                const dy = (seededRandom(seed+0.33)  - 0.5) * 260;
                const rot = (seededRandom(seed+0.66) - 0.5) * 220;

                span.dataset.dx = dx.toFixed(1);
                span.dataset.dy = dy.toFixed(1);
                span.dataset.rot = rot.toFixed(1);

                wordSpan.appendChild(span);

            });

            lineEl.appendChild(wordSpan);

            if(wi < words.length - 1){
                lineEl.appendChild(document.createTextNode(" "));
                i++; // keep seeds stable/unique across the skipped space slot
            }

        });

        block.appendChild(lineEl);

    });

    // The whole block tilts together, as one — every line shares the exact
    // same angle, so the paragraph reads as one crooked piece of type set
    // at a slant, not as separate lines each leaning their own way.
    block.style.transform = `rotate(${tiltFor(blockIdx).toFixed(2)}deg)`;

}

// One small, consistent tilt per text block (seeded so it's stable across
// re-renders, and varies a bit fragment to fragment).
function tiltFor(blockIdx){
    const amplitude = 4; // degrees
    return (seededRandom(blockIdx * 7.13) - 0.5) * 2 * amplitude;
}

document.querySelectorAll(".fragment-text").forEach(wrapText);

/* ------------------------------ */
/* VERTICAL TITLE — tool name stacked letter by letter, each one nudged   */
/* slightly left/right, reading down instead of across (ref: HFBK          */
/* "Writing In Future" logotype).                                          */
/* ------------------------------ */

let vtCounter = 0;

function renderVerticalTitle(el){

    // Clean vertical stacks, left-aligned, no jitter — matches the
    // reference (HFBK "Writing In Future"): letters read straight down.
    // Multi-word titles are split across two side-by-side columns instead
    // of one single tall column, so the title never ends up taller than
    // its own description next to it. The split point is chosen to keep
    // both columns as close in height as possible.
    const title = el.dataset.title || "";
    const words = title.split(" ").filter(w => w.length > 0);

    let splitAt = words.length;
    if(words.length > 1){
        const total = words.reduce((sum, w)=> sum + w.length, 0);
        let running = 0;
        let best = Infinity;
        for(let i = 0; i < words.length - 1; i++){
            running += words[i].length;
            const diff = Math.abs(running - total/2);
            if(diff < best){ best = diff; splitAt = i + 1; }
        }
    }

    function buildCol(wordsGroup){
        const col = document.createElement("div");
        col.className = "vt-col";

        wordsGroup.forEach((word, wi)=>{

            word.split("").forEach(ch=>{
                const span = document.createElement("span");
                span.className = "vt-letter";
                span.textContent = ch;
                col.appendChild(span);
            });

            if(wi < wordsGroup.length - 1){
                const gap = document.createElement("span");
                gap.className = "vt-gap";
                col.appendChild(gap);
            }

        });

        return col;
    }

    el.appendChild(buildCol(words.slice(0, splitAt)));

    const col2Words = words.slice(splitAt);
    if(col2Words.length){
        el.appendChild(buildCol(col2Words));
    }

}

document.querySelectorAll(".frag-title-vert").forEach(renderVerticalTitle);

/* ------------------------------ */
/* PAN STATE */
/* ------------------------------ */

const viewport = document.getElementById("viewport");
const world = document.getElementById("world");

let tx = 0, ty = 0;
let scale = 1;
const minScale = 1, maxScale = 2.5;
let homeTx = 0, homeTy = 0;

function setInitialPosition(){
    // centro approssimativo del primo frammento (f1)
    const focusX = 1900 + 140;
    const focusY = 1800 + 50;

    // offset volontario: il testo è "intravisto", non già a fuoco pieno
    const offsetX = 160;
    const offsetY = 110;

    tx = (window.innerWidth/2)  - focusX + offsetX;
    ty = (window.innerHeight/2) - focusY + offsetY;

    homeTx = tx;
    homeTy = ty;
}

setInitialPosition();

function applyTransform(){
    // non si può scrollare oltre i bordi del foglio (6000x4000)
    const worldW = 6000, worldH = 4000;
    const margin = 400; // un po' di respiro oltre il contenuto

    const minTx = window.innerWidth  - worldW*scale - margin;
    const maxTx = margin;
    const minTy = window.innerHeight - worldH*scale - margin;
    const maxTy = margin;

    tx = Math.max(minTx, Math.min(maxTx, tx));
    ty = Math.max(minTy, Math.min(maxTy, ty));

    world.style.transformOrigin = "0 0";
    world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}
applyTransform();

/* ---- wheel / trackpad (pan in any direction, pinch/ctrl+wheel to zoom) ---- */

function handleWheel(e, offsetX, offsetY){

    const cx = e.clientX + offsetX;
    const cy = e.clientY + offsetY;

    if(e.ctrlKey || e.metaKey){
        // zoom, centered on cursor position
        const factor = Math.exp(-e.deltaY * 0.01);
        const newScale = Math.max(minScale, Math.min(maxScale, scale*factor));

        const worldX = (cx - tx) / scale;
        const worldY = (cy - ty) / scale;

        tx = cx - worldX*newScale;
        ty = cy - worldY*newScale;
        scale = newScale;

    } else {
        tx -= e.deltaX;
        ty -= e.deltaY;
    }

    applyTransform();
    requestUpdate();
}

viewport.addEventListener("wheel", e=>{
    e.preventDefault();
    handleWheel(e, 0, 0);
}, { passive:false });

/* ------------------------------ */
/* FOCUS — distanza 2D dal centro schermo */
/* ------------------------------ */

function updateFragments(){

    const fragments = Array.from(document.querySelectorAll(".fragment-text"));

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const plateau = Math.min(window.innerWidth, window.innerHeight) * 0.18;
    const fadeRange = Math.min(window.innerWidth, window.innerHeight) * 0.55;

    fragments.forEach(block=>{

        const rect = block.getBoundingClientRect();
        const bx = rect.left + rect.width/2;
        const by = rect.top + rect.height/2;

        const dist = Math.hypot(bx-cx, by-cy);

        let focus;
        if(dist <= plateau){
            focus = 1;
        } else {
            focus = Math.max(0, 1 - (dist-plateau)/fadeRange);
        }
        const scatter = 1 - focus;

        block.querySelectorAll(".letter").forEach(span=>{
            const dx = parseFloat(span.dataset.dx) * scatter;
            const dy = parseFloat(span.dataset.dy) * scatter;
            const rot = parseFloat(span.dataset.rot) * scatter;
            const opacity = 0.12 + focus*0.88;

            span.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
            span.style.opacity = opacity;
        });

    });

}

let ticking = false;
function requestUpdate(){
    if(!ticking){
        requestAnimationFrame(()=>{
            updateFragments();
            ticking = false;
        });
        ticking = true;
    }
}

window.addEventListener("resize", updateFragments);
window.addEventListener("load", updateFragments);

updateFragments();

/* ------------------------------ */
/* CLICK LINKS — pan camera + draw arrow */
/* ------------------------------ */

const linkOverlay = document.getElementById("link-overlay");
let activeLinks = []; // [{ sourceEl, targetEl, pathEl }]
let panAnim = null;

function easeInOutQuad(t){
    return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
}

function panToCoords(destTx, destTy){

    const startTx = tx, startTy = ty;
    const duration = 700;
    const startTime = performance.now();

    if(panAnim) cancelAnimationFrame(panAnim);

    function step(now){
        const t = Math.min(1, (now-startTime)/duration);
        const e = easeInOutQuad(t);

        tx = startTx + (destTx-startTx)*e;
        ty = startTy + (destTy-startTy)*e;

        applyTransform();
        updateFragments();
        updateAllLinkArrows();

        if(t<1){
            panAnim = requestAnimationFrame(step);
        }
    }
    panAnim = requestAnimationFrame(step);

}

function panTo(targetEl){

    const targetWorldX = parseFloat(targetEl.style.left);
    const targetWorldY = parseFloat(targetEl.style.top);
    const targetW = targetEl.offsetWidth;
    const targetH = targetEl.offsetHeight;

    const destTx = (window.innerWidth/2)  - (targetWorldX + targetW/2)*scale;
    const destTy = (window.innerHeight/2) - (targetWorldY + targetH/2)*scale;

    panToCoords(destTx, destTy);

}

function computeClampedPoints(sourceEl, targetEl){

    const r1 = sourceEl.getBoundingClientRect();
    const r2 = targetEl.getBoundingClientRect();

    let x1 = r1.left + r1.width/2;
    let y1 = r1.top  + r1.height/2;
    let x2 = r2.left + r2.width/2;
    let y2 = r2.top  + r2.height/2;

    const pad = 24;
    x1 = Math.max(pad, Math.min(window.innerWidth-pad, x1));
    y1 = Math.max(pad, Math.min(window.innerHeight-pad, y1));
    x2 = Math.max(pad, Math.min(window.innerWidth-pad, x2));
    y2 = Math.max(pad, Math.min(window.innerHeight-pad, y2));

    return { x1, y1, x2, y2 };

}

function updateAllLinkArrows(){

    activeLinks.forEach(link=>{

        const { x1, y1, x2, y2 } = computeClampedPoints(link.sourceEl, link.targetEl);
        const mx = (x1+x2)/2, my = (y1+y2)/2 - 40;

        link.pathEl.setAttribute("d", `M${x1},${y1} Q${mx},${my} ${x2},${y2}`);

    });

}

function addLink(sourceEl, targetEl){

    const pathEl = document.createElementNS("http://www.w3.org/2000/svg","path");
    pathEl.setAttribute("marker-end","url(#arrowhead)");
    linkOverlay.appendChild(pathEl);

    activeLinks.push({ sourceEl, targetEl, pathEl });

}

document.querySelectorAll(".clickable").forEach(el=>{

    el.addEventListener("click", (e)=>{

        e.stopPropagation();

        const targetEl = document.getElementById(el.dataset.link);
        if(!targetEl) return;

        addLink(el, targetEl);
        panTo(targetEl);

    });

});

/* ------------------------------ */
/* SCRAMBLE ON HOVER — "read by the machine": the letter under the cursor
   flickers into other characters while hovered, and freezes on whatever
   character it lands on when the cursor moves away — the word
   accumulating "misreadings" as you sweep across it */
/* ------------------------------ */

const SCRAMBLE_POOL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&@*+=-/?!";

function wireScrambleLetter(span){

    if(span.dataset.char === "\u00A0") return;

    let scrambleId = null;

    span.addEventListener("mouseenter", ()=>{
        if(scrambleId) return;
        span.textContent = SCRAMBLE_POOL[Math.floor(Math.random()*SCRAMBLE_POOL.length)];
        scrambleId = setInterval(()=>{
            span.textContent = SCRAMBLE_POOL[Math.floor(Math.random()*SCRAMBLE_POOL.length)];
        }, 90);
    });

    span.addEventListener("mouseleave", ()=>{
        clearInterval(scrambleId);
        scrambleId = null;
        // freeze: leave whatever character is currently showing
    });

}

document.querySelectorAll(".clickable").forEach(el=>{
    el.querySelectorAll(".letter").forEach(wireScrambleLetter);
});

/* ---- same effect on the READ ME / PUBLICATION titles ---- */

function wireScrambleTitle(el){
    const text = el.textContent;
    el.textContent = "";

    text.split("").forEach(ch=>{
        const span = document.createElement("span");
        const displayCh = ch === " " ? "\u00A0" : ch;
        span.textContent = displayCh;
        span.dataset.char = displayCh;
        span.style.display = "inline-block";
        el.appendChild(span);
        wireScrambleLetter(span);
    });
}

wireScrambleTitle(document.getElementById("publication-link"));

window.addEventListener("wheel", ()=>{
    if(activeLinks.length) requestAnimationFrame(updateAllLinkArrows);
}, { passive:true });

document.getElementById("recenter").addEventListener("click", ()=>{
    scale = 1;
    panToCoords(homeTx, homeTy);

    // restore any frozen/scrambled letters back to their original text
    document.querySelectorAll("[data-char]").forEach(span=>{
        span.textContent = span.dataset.char;
    });
});

document.querySelectorAll(".index-num").forEach(btn=>{
    btn.addEventListener("click", ()=>{
        const target = document.getElementById(btn.dataset.target);
        if(target) panTo(target);
    });
});

/* ------------------------------ */
/* USER NOTES — solo per la sessione corrente, nessuna persistenza */
/* ------------------------------ */

function renderNote(x, y, text){

    const el = document.createElement("div");
    el.className = "fragment user-note";
    el.style.top  = y + "px";
    el.style.left = x + "px";

    const textEl = document.createElement("div");
    textEl.className = "fragment-text small";
    textEl.dataset.text = text;
    el.appendChild(textEl);

    world.appendChild(el);
    wrapText(textEl);

    // doppio click sulla nota = elimina
    el.addEventListener("dblclick", (e)=>{
        e.stopPropagation();
        el.remove();
    });

}

/* ---- creazione di una nuova nota: doppio click su spazio vuoto ---- */

viewport.addEventListener("dblclick", (e)=>{

    // ignora se il doppio click è su un frammento esistente
    if(e.target.closest(".fragment")) return;

    const worldX = e.clientX - tx;
    const worldY = e.clientY - ty;

    const wrapper = document.createElement("div");
    wrapper.className = "fragment user-note";
    wrapper.style.top  = worldY + "px";
    wrapper.style.left = worldX + "px";

    const input = document.createElement("input");
    input.className = "note-input";
    input.type = "text";
    input.placeholder = "write a note…";
    wrapper.appendChild(input);

    world.appendChild(wrapper);
    input.focus();

    function commit(){

        const value = input.value.trim();
        wrapper.remove();

        if(!value) return;

        renderNote(worldX, worldY, value);
        updateFragments();

    }

    input.addEventListener("keydown", ev=>{
        if(ev.key === "Enter") commit();
        if(ev.key === "Escape"){ wrapper.remove(); }
    });
    input.addEventListener("blur", commit);

});




/* ------------------------------ */
/* TOOL OVERLAY */
/* ------------------------------ */

const toolOverlay      = document.getElementById("tool-overlay");
const toolOverlayFrame = document.getElementById("tool-overlay-iframe");
const antiTypeFrame    = document.getElementById("anti-type-iframe");
const toolOverlayTitle = document.getElementById("tool-overlay-title");
const toolLinks        = document.querySelectorAll(".tool-link");
const ANTI_TYPE_SRC    = "tools/anti-ocr.html";

function openTool(src, name){
    if(src === ANTI_TYPE_SRC){
        // load it once, then just reveal it — never reload while switching
        // tools, so an in-progress run keeps going in the background
        if(!antiTypeFrame.dataset.loaded){
            antiTypeFrame.src = src;
            antiTypeFrame.dataset.loaded = "1";
        }
        antiTypeFrame.classList.add("show");
        // asking here, from a real click, works far more reliably across
        // browsers (Safari especially) than asking from inside the iframe
        if(typeof Notification !== "undefined" && Notification.permission === "default"){
            Notification.requestPermission();
        }
        clearAntiTypeUpdateFlag();
    } else {
        antiTypeFrame.classList.remove("show");
        // avoid reloading the iframe if this tool is already the one showing
        if(toolOverlayFrame.dataset.currentSrc !== src){
            toolOverlayFrame.src = src;
            toolOverlayFrame.dataset.currentSrc = src;
        }
    }

    toolOverlayTitle.textContent = name;
    toolOverlay.classList.add("show");
    document.getElementById("tool-guide-btn").disabled = false;

    toolLinks.forEach(link=>{
        link.classList.toggle("active", link.dataset.toolSrc === src);
    });
}

// single sidebar entry point for every tool's own "how it works" guide —
// each tool page still owns its guide content/modal, this just asks the
// currently-visible iframe to open it
document.getElementById("tool-guide-btn").addEventListener("click", ()=>{
    const activeFrame = antiTypeFrame.classList.contains("show") ? antiTypeFrame : toolOverlayFrame;
    if(!activeFrame.contentWindow) return;
    activeFrame.contentWindow.postMessage({ type: "open-guide" }, location.origin);
});

/* Anti Type runs in the background (see above) and reports back here      */
/* when a word or font export finishes, via postMessage from its iframe.   */
/* We try an OS notification, but don't rely on it alone — Safari in       */
/* particular can silently withhold permission — so there's always a       */
/* visible fallback too: a dot on the sidebar link plus a flashed tab      */
/* title, both cleared the moment Anti Type is reopened.                   */
const pageTitle = document.title;
const antiTypeLink = document.querySelector('.tool-link[data-tool-src="' + ANTI_TYPE_SRC + '"]');

function clearAntiTypeUpdateFlag(){
    if(antiTypeLink) antiTypeLink.classList.remove("has-update");
    document.title = pageTitle;
}

window.addEventListener("message", (event)=>{
    if(event.origin !== location.origin) return;
    if(!event.data || event.data.type !== "anti-type-done") return;

    const { title, body } = event.data;

    if(typeof Notification !== "undefined" && Notification.permission === "granted"){
        try { new Notification(title, { body }); } catch(e) {}
    }

    // visible fallback, always shown regardless of notification permission
    if(antiTypeLink) antiTypeLink.classList.add("has-update");
    document.title = "● " + pageTitle;
});

window.addEventListener("focus", ()=>{
    if(antiTypeFrame.classList.contains("show")) clearAntiTypeUpdateFlag();
});

// opened from a fragment on the canvas
document.querySelectorAll(".open-tool").forEach(btn=>{
    btn.addEventListener("click", e=>{
        e.stopPropagation();
        openTool(btn.dataset.toolSrc, btn.dataset.toolName);
    });
});

// switched from the sidebar, without leaving the overlay
toolLinks.forEach(btn=>{
    btn.addEventListener("click", ()=>{
        openTool(btn.dataset.toolSrc, btn.dataset.toolName);
    });
});

document.getElementById("tool-overlay-close").addEventListener("click", ()=>{
    toolOverlay.classList.remove("show");
    toolOverlayFrame.src = "";
    toolOverlayFrame.dataset.currentSrc = "";
    toolLinks.forEach(link=> link.classList.remove("active"));
});

/* ------------------------------ */
/* HINT — shows every time you arrive here from index.html               */
/* ------------------------------ */

(function(){
    const hint = document.getElementById("hint");
    // Referrer isn't reliable for local file:// testing (browsers strip it),
    // so index.html tags its link/redirect with ?from=index instead.
    const cameFromIndex = new URLSearchParams(location.search).get("from") === "index";

    if(cameFromIndex){
        requestAnimationFrame(()=> hint.classList.add("show"));
        setTimeout(()=> hint.classList.remove("show"), 3000);
    }
})();

</script>
