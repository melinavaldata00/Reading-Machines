<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Machines — Process</title>
<style>

@font-face {
  font-family: "ABC Gaisyr";
  src: url("./fonts/ABCGaisyrMono-Light-Trial.otf") format("opentype");
}

@font-face {
  font-family: "ABC Stefan";
  src: url("./fonts/ABCStefan-Simple-Trial.otf") format("opentype");
}

@font-face {
  font-family: "ABC Favorit";
  src: url("./fonts/ABCFavorit-Regular-Trial.otf") format("opentype");
  font-display: swap;
}

/* updated Anti Type typeface (v2) — replaces the original export.        */
@font-face {
  font-family: "Anti-Type";
  src: url("./fonts/anti-ocr-2.otf") format("opentype");
  font-display: swap;
}

:root{
  --bg:#170d03;
  --text:#3fff00;
  --text-dim: rgba(63,255,0,.3);
  --text-faint: rgba(63,255,0,.15);
}

*{ margin:0; padding:0; box-sizing:border-box; }

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:"ABC Favorit", monospace;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* publication isn't a tool — it lives outside the canvas/overlay      */
/* system entirely, reached instead through this persistent top-center   */
/* link, in the spot ENTER used to occupy before it moved to index.html. */
#publication-link{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  font-size:13px;
  letter-spacing:.2em;
  font-family:"ABC Gaisyr", monospace;
  color:var(--text);
  z-index:50;
  text-decoration:none;
  opacity:.85;
  transition:opacity .2s;
}

#publication-link:hover{
  opacity:.55;
}

#back-to-start{
  position:fixed;
  top:18px;
  left:24px;
  z-index:50;
  text-decoration:none;
  color:var(--text);
  opacity:.7;
  transition:opacity .2s;
  font-size:13px;
  gap:5px;
}

#back-to-start:hover{
  opacity:1;
}

#go-to-docs{
  position:fixed;
  right:22px;
  bottom:66px;
  z-index:50;
  text-decoration:none;
  color:var(--text);
  opacity:.7;
  transition:opacity .2s;
  font-size:13px;
  gap:5px;
}

#go-to-docs:hover{
  opacity:1;
}

/* left-hand page index — now jumps between the 4 presentation pages     */
/* instead of panning the old canvas.                                    */
#index-bar{
  position:fixed;
  left:24px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:22px;
  z-index:50;
}

.index-num{
  background:none;
  border:none;
  color:var(--text);
  font-family:"ABC Gaisyr", monospace;
  font-size:12px;
  letter-spacing:.1em;
  cursor:pointer;
  padding:0;
  opacity:.4;
  transition:opacity .2s, color .2s;
}

/* on the white OCR Skeleton page the index numbers switch to the same    */
/* brown used by every button on that page, instead of green-on-white.    */
body.page-is-white .index-num{
  color:#1f130d;
}

.index-num:hover{
  opacity:.8;
}

.index-num.active{
  opacity:1;
}

.open-tool,
.open-page{
  display:inline-block;
  margin-top:14px;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--text);
  opacity:1;
  cursor:pointer;
  background:none;
  border:1px solid var(--text);
  border-radius:14px;
  font-family:inherit;
  padding:8px 16px;
  text-decoration:none;
  transition:background .2s, color .2s;
}

.open-tool:hover,
.open-page:hover{
  background:var(--text);
  color:var(--bg);
}

/* on the white OCR Skeleton page these buttons switch to the same brown  */
/* used everywhere else on white backgrounds, instead of green-on-white.  */
body.page-is-white .open-page{
  color:#1f130d;
  border-color:#1f130d;
}
body.page-is-white .open-page:hover{
  background:#1f130d;
  color:#ffffff;
}

/* Opening a tool slides a layer up from the bottom instead of covering    */
/* the full screen — it stops short of the top edge, on purpose, so the    */
/* current presentation page's title stays visible above it. Full-bleed    */
/* iframe, a small close control and the guide trigger floating over it.   */
/* No sidebar, no list of the other tools: each presentation page already  */
/* owns its own GO TO TOOL button, so there's no need to reference the     */
/* other three from inside the layer itself.                               */
#tool-overlay{
  /* scoped white/brown override — the layer reads white/brown while a     */
  /* tool is open; the canvas outside stays on the dark palette, since      */
  /* these vars only cascade to #tool-overlay's own descendants.            */
  --bg:#ffffff;
  --text:#1f130d;
  --text-dim: rgba(31,19,13,.45);
  --text-faint: rgba(31,19,13,.22);

  position:fixed;
  left:0;
  right:0;
  bottom:0;
  top:170px; /* leaves the page title, sitting up at top:40px, visible above */
  z-index:200;
  background:var(--bg);
  color:var(--text);
  border-top:1px solid var(--text-dim);
  transform:translateY(100%);
  transition:transform .5s cubic-bezier(.65,0,.35,1);
  pointer-events:none;
}

#tool-overlay.show{
  transform:translateY(0);
  pointer-events:auto;
}

/* thin floating strip: current tool's name, its guide trigger, and the   */
/* close control — the only chrome on top of the tool itself.              */
#tool-overlay-bar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:0 14px;
  z-index:5;
  pointer-events:none;
}
#tool-overlay-bar > *{
  pointer-events:auto;
}

#tool-overlay-title{
  font-size:10px;
  letter-spacing:.04em;
  color:var(--text-dim);
}

#tool-guide-btn{
  background:none;
  border:none;
  color:var(--text-dim);
  font-family:inherit;
  font-size:11px;
  letter-spacing:.05em;
  cursor:pointer;
  padding:0;
  text-decoration:underline;
  text-underline-offset:2px;
  opacity:.85;
  transition:opacity .2s, color .2s;
}
#tool-guide-btn:hover{
  opacity:1;
  color:var(--text);
}
#tool-guide-btn:disabled{
  opacity:.3;
  pointer-events:none;
}

#tool-overlay-close{
  background:none;
  border:1px solid var(--text-dim);
  border-radius:14px;
  color:var(--text);
  font-family:inherit;
  font-size:11px;
  letter-spacing:.08em;
  cursor:pointer;
  padding:6px 10px;
  opacity:.7;
  transition:opacity .2s, background .2s, color .2s, border-color .2s;
}

#tool-overlay-close:hover{
  opacity:1;
  background:#2bff00;
  color:#1f130d;
  border-color:#2bff00;
}

#tool-overlay-iframe{
  position:absolute;
  top:34px;
  left:0;
  right:0;
  bottom:0;
  border:none;
  width:100%;
  height:calc(100% - 34px);
}

/* Anti Type gets its own dedicated iframe that is never unloaded once     */
/* opened: font-loop requests can take a while, so switching to another    */
/* tool must not kill an in-progress run. It's just hidden (not removed)   */
/* while a different tool is shown, and keeps running underneath.          */
#anti-type-iframe{
  position:absolute;
  top:34px;
  left:0;
  right:0;
  bottom:0;
  border:none;
  width:100%;
  height:calc(100% - 34px);
  display:none;
}
#anti-type-iframe.show{ display:block; }
#anti-type-iframe.show ~ #tool-overlay-iframe{ display:none; }

/* ------------------------------ */
/* PRESENTER — 4 full sequential pages, one per tool, each reading its   */
/* description text through its own bespoke visual system instead of a   */
/* plain paragraph.                                                       */
/* ------------------------------ */

#presenter{
  position:fixed;
  inset:0;
  z-index:10;
}

.tool-page{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  justify-content:center;
  padding:0 90px;
  overflow-y:auto;
}

.tool-page.active{
  display:flex;
}

.tp-head{
  display:flex;
  align-items:baseline;
  gap:16px;
  margin-bottom:34px;
}

.tp-num{
  font-family:"ABC Gaisyr", monospace;
  font-size:13px;
  letter-spacing:.15em;
  color:var(--text-dim);
}

.tp-title{
  font-family:"ABC Gaisyr", monospace;
  font-size:30px;
  letter-spacing:.03em;
  font-weight:400;
}

.tp-text{
  font-family:"ABC Favorit", monospace;
  font-size:19px;
  line-height:1.55;
}

/* fade/rise entrance — replays every time a page's display switches      */
/* back from none to flex, since CSS animations restart on that toggle,   */
/* no JS needed to re-trigger it.                                          */
@keyframes tpFadeUp{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}
.tool-page.active .tp-head{
  animation:tpFadeUp .5s ease both;
}

/* ---- 01 OCR Skeleton — 1-3 words at a time inside floating boxes of    */
/* varying size, each one drifting slowly up or down. Only the first is   */
/* visible; clicking it reveals the next box elsewhere in the space,      */
/* and so on — the guesses arrive one at a time, exactly like the tool.   */
.tool-page.tp-float{
  --bg:#ffffff;
  padding:0;
  overflow:hidden;
  justify-content:flex-start;
  background:var(--bg);
}
.tp-float .tp-head{
  position:absolute;
  top:40px;
  left:24px;
  z-index:2;
  margin:0;
}
/* title styled after the documentation site's own hero heading —        */
/* ABC Favorit, huge, near-black — everything else on this page stays    */
/* on the green/dark palette so we can see how green reads on white.     */
.tp-float .tp-title{
  display:block;
  font-family:"ABC Favorit", Helvetica, Arial, sans-serif;
  font-size:clamp(48px, 9vw, 120px);
  font-weight:400;
  line-height:.92;
  letter-spacing:-.02em;
  color:#1f130d;
}
.tp-float .tp-text{
  position:absolute;
  inset:0;
}

.ocr-box{
  position:absolute;
  border:1px solid var(--text-dim);
  padding:.55em .85em;
  line-height:1.3;
  max-width:min(60vw, 360px);
  background:var(--bg);
  opacity:0;
  pointer-events:none;
  cursor:default;
  transition:opacity .6s ease, border-color .2s ease, background .2s ease, color .2s ease;
}
.ocr-box.visible{
  opacity:1;
  pointer-events:auto;
  animation:var(--floatAnim) var(--fdur) ease-in-out infinite alternate;
}
.ocr-box.clickable{
  border-color:var(--text);
  cursor:pointer;
}
.ocr-box.clickable:hover{
  background:var(--text);
  color:var(--bg);
}
@keyframes boxFloatDown{
  from{ transform:translateY(calc(-1 * var(--famp))); }
  to{ transform:translateY(var(--famp)); }
}
@keyframes boxFloatUp{
  from{ transform:translateY(var(--famp)); }
  to{ transform:translateY(calc(-1 * var(--famp))); }
}

/* ---- 02 Blind Contour — each word is built from the REAL contour points */
/* the tool's own algorithm produces (server.py's outline branch, traced   */
/* locally with the same OpenCV steps: Otsu threshold, morphological open, */
/* findContours). The real traced points are drawn as a smooth curve       */
/* through them (no straight polyline segments, so no zig-zag) and drift   */
/* gently at rest. On hover each point eases into a slow, low-frequency    */
/* sway — soft and continuous, like the outline is malleable — then eases  */
/* back to its true traced form on mouseleave. Real data, pliable surface. */
.tool-page.tp-bc-exaggerate{
  padding:0;
  overflow:hidden;
}
.tp-bc-exaggerate .tp-head{
  position:absolute;
  top:40px;
  left:24px;
  z-index:2;
  margin:0;
}
.tp-bc-exaggerate .tp-title{
  display:block;
  font-family:"ABC Favorit", Helvetica, Arial, sans-serif;
  font-size:clamp(48px, 9vw, 120px);
  font-weight:400;
  line-height:.92;
  letter-spacing:-.02em;
  color:var(--text);
}
.tp-bc-exaggerate .tp-text{
  position:absolute;
  inset:0;
  display:flex;
  flex-wrap:wrap;
  align-content:center;
  gap:14px 30px;
  padding:220px 90px 60px 24px;
  overflow-y:auto;
}
.bc-word{
  position:relative;
  display:inline-block;
  height:clamp(38px, 6.6vw, 92px);
  cursor:pointer;
  animation:tpFadeUp .45s ease both;
}
.bc-blob{
  position:absolute;
  inset:-10%;
  width:120%;
  height:120%;
  animation:bcDrift var(--ddur, 8s) ease-in-out infinite;
  animation-delay:var(--ddelay, 0s);
}
.bc-blob path{
  fill:none;
  stroke:var(--text);
  stroke-width:3;
  stroke-linejoin:round;
  stroke-linecap:round;
}
@keyframes bcDrift{
  0%   { transform:translate(0, 0) scale(1); }
  25%  { transform:translate(3%, -4%) scale(1.02); }
  50%  { transform:translate(-2%, 3%) scale(0.985); }
  75%  { transform:translate(-3%, -2%) scale(1.015); }
  100% { transform:translate(0, 0) scale(1); }
}
.bc-word:hover .bc-blob path{
  stroke-width:3.5;
}

/* ---- 03 Anti Type — the text types itself out, letter by letter, set   */
/* in the real exported Anti-Type font. Title sits in the exact same spot */
/* as OCR Skeleton's (inherited from .tp-float .tp-head, unmodified) —    */
/* only the overflow behaviour is overridden here, since this page's      */
/* content is a single in-flow panel instead of a free-floating box space.*/
.tp-float.tp-anti-write{
  overflow-y:auto;
}
.tp-float.tp-anti-write .tp-text{
  position:static;
  inset:auto;
}

.at-panel{
  margin:240px 90px 60px 24px;
}
.at-body{
  font-family:"Anti-Type", monospace;
  font-size:clamp(40px, 6.5vw, 84px);
  line-height:1.3;
  color:#1f130d;
  white-space:pre-wrap;
  word-wrap:break-word;
  cursor:text;
}
.at-content[contenteditable="true"]{
  outline:none;
}
.at-cursor{
  display:inline-block;
  margin-left:2px;
  color:#1f130d;
  animation:atBlink 1s step-end infinite;
}
@keyframes atBlink{
  0%, 100%{ opacity:1; }
  50%{ opacity:0; }
}

/* ---- 04 Reading Loop — the text is broken into phrase-length pieces     */
/* scattered across a small pannable space. Only the current piece is a   */
/* live link; clicking it pans the "camera" to wherever the next piece    */
/* sits, so reading becomes a sequence of jumps instead of one continuous */
/* paragraph. The last piece links back to the first — the loop. Green    */
/* background instead of the site's default dark one; title matches OCR   */
/* Skeleton/Anti Type's position and size exactly.                        */
.tool-page.tp-rl-camera{
  --bg:#3fff00;
  --text:#1f130d;
  --text-dim: rgba(31,19,13,.45);
  --text-faint: rgba(31,19,13,.22);
  padding:0;
  overflow:hidden;
  background:var(--bg);
}
.tp-rl-camera .tp-head{
  position:absolute;
  top:40px;
  left:24px;
  z-index:2;
  margin:0;
}
.tp-rl-camera .tp-title{
  display:block;
  font-family:"ABC Favorit", Helvetica, Arial, sans-serif;
  font-size:clamp(48px, 9vw, 120px);
  font-weight:400;
  line-height:.92;
  letter-spacing:-.02em;
  color:#1f130d;
}
.tp-rl-camera .tp-text{
  position:absolute;
  inset:0;
}
.rl-viewport{
  position:absolute;
  inset:0;
  overflow:hidden;
}
.rl-world{
  position:absolute;
  top:0;
  left:0;
  will-change:transform;
  transition:transform .45s cubic-bezier(.65,0,.35,1);
}
.rl-piece{
  position:absolute;
  max-width:1200px;
  white-space:nowrap;
  font-family:"ABC Favorit", monospace;
  font-size:20px;
  line-height:1.55;
  color:var(--text-dim);
  opacity:.45;
  transition:color .3s ease, opacity .3s ease;
}
.rl-piece.visited{
  opacity:.3;
}
.rl-piece.active{
  color:var(--text);
  opacity:1;
  cursor:pointer;
}
.rl-piece.active:hover{
  opacity:.7;
}

/* ---- NEXT / GO TO TOOL — fixed corner controls for moving through the  */
/* 4 pages and jumping into whichever tool is currently on screen.         */
#btn-next{
  position:fixed;
  bottom:18px;
  right:22px;
  z-index:50;
}
#btn-go-tool{
  position:fixed;
  bottom:18px;
  left:24px;
  z-index:50;
}

</style>
</head>

<div id="tool-overlay">
  <div id="tool-overlay-bar">
    <span id="tool-overlay-title">—</span>
    <button id="tool-guide-btn" disabled>how does it work?</button>
    <button id="tool-overlay-close">✕ close</button>
  </div>
  <iframe id="anti-type-iframe" src="" title="Anti Type"></iframe>
  <iframe id="tool-overlay-iframe" src="" title="tool"></iframe>
</div>

<a href="index.html" id="back-to-start">← back to start</a>
<a href="tools/publication.html" id="publication-link">PUBLICATION</a>
<a href="https://melinavaldata00.github.io/RMDocumentation/" id="go-to-docs" target="_blank" rel="noopener">documentation →</a>

<div id="index-bar">
  <button class="index-num active" data-idx="0">01</button>
  <button class="index-num" data-idx="1">02</button>
  <button class="index-num" data-idx="2">03</button>
  <button class="index-num" data-idx="3">04</button>
</div>

<div id="presenter">

  <section class="tool-page tp-float active" data-idx="0" data-tool-src="tools/position-zero.html" data-tool-name="OCR Skeleton">
    <div class="tp-head">
      <span class="tp-title">OCR Skeleton</span>
    </div>
    <div class="tp-text" data-style="floatboxes" data-text="Before recognizing a single letter, an OCR system does something simpler first: it figures out [[where something might be written.]] [[The page is divided]] into rectangles, bounding boxes, drawn around clusters of dark pixels the system thinks could be words. Only after that does it try to guess what each word actually says, along with a number for how confident it is about that guess."></div>
  </section>

  <section class="tool-page tp-bc-exaggerate" data-idx="1" data-tool-src="tools/outline.html" data-tool-name="Blind Contour">
    <div class="tp-head">
      <span class="tp-title">Blind Contour</span>
    </div>
    <div class="tp-text" data-style="abstract-words" data-text="The machine keeps only the shapes it recognizes as writing and discards the rest as noise, handing back pure outline — a contour you can scale, rotate, or trust exactly as much as it does."></div>
  </section>

  <section class="tool-page tp-float tp-anti-write" data-idx="2" data-tool-src="tools/anti-ocr.html" data-tool-name="Anti Type">
    <div class="tp-head">
      <span class="tp-title">Anti Type</span>
    </div>
    <div class="tp-text" data-style="antitype-write" data-text="Every letter has a point at which a machine stops recognizing it. Not because the shape has disappeared, it is still there visible to a human eye, but because enough of its detail has been removed that the system can no longer produce a confident guess about what it is."></div>
  </section>

  <section class="tool-page tp-rl-camera" data-idx="3" data-tool-src="tools/co-read.html" data-tool-name="Reading Loop">
    <div class="tp-head">
      <span class="tp-title">Reading Loop</span>
    </div>
    <div class="tp-text" data-style="camera-links" data-text="what happens when a machine reads what is left from its previous reading? The tool takes an image as input and runs it through OCR, producing a typeset document — each word placed, sized, and positioned according to what the system found."></div>
  </section>

</div>

<button id="btn-go-tool" class="open-page">open tool →</button>
<button id="btn-next" class="open-page">next →</button>

<script>

/* ------------------------------ */
/* SEEDED RANDOM */
/* ------------------------------ */

function seededRandom(seed){
    let s = Math.sin(seed) * 10000;
    return s - Math.floor(s);
}

/* ------------------------------ */
/* READING SYSTEMS — one bespoke visual treatment per tool page, each    */
/* built from the same plain data-text string.                            */
/* ------------------------------ */

let wrapCounter = 0;

// Blind Contour's real traced data — one entry per word of that page's
// data-text, in order. {w: word, p: [[[x,y],[x,y],...], ...], vw, vh: the
// word's own bounding-box size in the traced pixel space}. Points, not
// path strings — kept raw so they can be drawn as a smooth curve and
// nudged per-point on hover. Generated offline (Python + OpenCV) by
// running server.py's exact 'outline' layer algorithm against each word

// Type's typing effect) only while its page is actually on screen.
const pageHooks = {};

// 01 OCR Skeleton — the text is chunked into groups of 1-3 words, each one
// living inside a floating box of its own size, drifting slowly up or down.
// Only the first box starts visible; clicking a box reveals the next one,
// placed elsewhere in the space — the guesses arrive one at a time.
function wrapFloatBoxes(block){
    const raw = block.dataset.text.replace(/\s+/g, ' ').trim();
    const blockIdx = wrapCounter++;

    // wrapping a phrase in [[ ]] inside data-text forces it to always land
    // in one box together, instead of being split up by the automatic
    // 2-3 word grouping below (e.g. "[[The page is divided]]").
    const units = [];
    const forcedRe = /\[\[(.*?)\]\]/g;
    let lastIndex = 0, m;
    const pushWords = str=>{
        str.trim().split(' ').filter(Boolean).forEach(w=> units.push({ t: w, forced: false }));
    };
    while((m = forcedRe.exec(raw))){
        pushWords(raw.slice(lastIndex, m.index));
        units.push({ t: m[1].trim(), forced: true });
        lastIndex = forcedRe.lastIndex;
    }
    pushWords(raw.slice(lastIndex));

    // group units into chunks of 2-3 (never a single plain word — otherwise
    // there are simply too many boxes to click through), seeded so it's
    // stable across re-renders. The very first box always opens on the
    // first two words (or the first forced group, if the text starts with
    // one), then the rest is grouped automatically. A forced group is
    // never merged with neighboring words — it always gets its own box.
    const chunks = [];
    let ui = 0, gi = 0;

    if(units.length){
        if(units[0].forced){
            chunks.push(units[0].t);
            ui = 1;
        } else {
            const take = [];
            while(ui < units.length && !units[ui].forced && take.length < 2){
                take.push(units[ui].t); ui++;
            }
            chunks.push(take.join(' '));
        }
    }

    while(ui < units.length){
        if(units[ui].forced){
            chunks.push(units[ui].t);
            ui++;
            continue;
        }
        const size = 2 + Math.floor(seededRandom(blockIdx*1000 + gi) * 2); // 2–3
        const take = [];
        while(ui < units.length && !units[ui].forced && take.length < size){
            take.push(units[ui].t); ui++;
        }
        chunks.push(take.join(' '));
        gi++;
    }

    // a trailing single-word chunk (leftover from the 2-3 grouping not
    // dividing evenly) gets folded into the previous box instead of
    // getting a whole box to itself.
    if(chunks.length > 1 && chunks[chunks.length - 1].split(' ').length < 2){
        const last = chunks.pop();
        chunks[chunks.length - 1] += ' ' + last;
    }

    const boxes = chunks.map((chunk, ci)=>{
        const box = document.createElement("div");
        box.className = "ocr-box";
        box.textContent = chunk;

        const seed = blockIdx*1000 + ci;
        const left  = 6  + seededRandom(seed + 0.1) * 68;   // 6%–74%
        const top   = 10 + seededRandom(seed + 0.2) * 64;   // 10%–74%
        const fsize = 14 + seededRandom(seed + 0.3) * 18;   // 14–32px
        const fdur  = 4.5 + seededRandom(seed + 0.4) * 4.5; // 4.5–9s
        const famp  = 26 + seededRandom(seed + 0.5) * 64;   // 26–90px
        const goingDown = seededRandom(seed + 0.6) > 0.5;

        box.style.left = left.toFixed(1) + "%";
        box.style.top  = top.toFixed(1) + "%";
        box.style.fontSize = fsize.toFixed(1) + "px";
        box.style.setProperty("--fdur", fdur.toFixed(2) + "s");
        box.style.setProperty("--famp", famp.toFixed(1) + "px");
        box.style.setProperty("--floatAnim", goingDown ? "boxFloatDown" : "boxFloatUp");

        block.appendChild(box);
        return box;
    });

    function revealBox(ci){
        const box = boxes[ci];
        box.classList.add("visible");
        if(ci < boxes.length - 1){
            box.classList.add("clickable");
            box.addEventListener("click", ()=>{
                if(box.dataset.used) return;
                box.dataset.used = "1";
                box.classList.remove("clickable");
                revealBox(ci + 1);
            });
        }
    }

    if(boxes.length) revealBox(0);
}

            });
            if(entry.intensity < 0.003 && entry.target === 0){
                active.delete(entry);
                entry.paths.forEach((pathEl, pi)=> pathEl.setAttribute("d", smoothPath(entry.basePts[pi])));
            }
        });
        rafId = active.size ? requestAnimationFrame(tick) : null;
    }
    function ensureLoop(){
        if(rafId === null) rafId = requestAnimationFrame(tick);
    }

    words.forEach((word, wi)=>{
        const data = BC_CONTOURS[wi] && BC_CONTOURS[wi].w === word ? BC_CONTOURS[wi] : null;

        const wrap = document.createElement("span");
        wrap.className = "bc-word";
        wrap.style.animationDelay = (wi * 0.04).toFixed(3) + 's';
        wrap.setAttribute("aria-label", word);

        if(data && data.p.length){
            wrap.style.aspectRatio = data.vw + " / " + data.vh;

            const svg = document.createElementNS(SVG_NS, "svg");
            svg.setAttribute("class", "bc-blob");
            svg.setAttribute("viewBox", "0 0 " + data.vw + " " + data.vh);
            svg.setAttribute("preserveAspectRatio", "none");
            svg.setAttribute("aria-hidden", "true");

            const seed = blockIdx*1000 + wi;
            // slow positional drift, out of phase per word — "move in
            // space" while at rest, on top of the traced form itself
            const driftDur   = (6 + seededRandom(seed + 0.4) * 5).toFixed(2) + "s";
            const driftDelay = "-" + (seededRandom(seed + 0.5) * 6).toFixed(2) + "s";
            svg.style.setProperty("--ddur", driftDur);
            svg.style.setProperty("--ddelay", driftDelay);

            const scale = Math.max(Math.min(data.vw, data.vh), 20);
            const pathEls = [];
            const phase = data.p.map((pts, pi)=> pts.map((p, vi)=>{
                const s = seed + pi*97 + vi*3.1;
                return {
                    fx: 0.5 + seededRandom(s + 0.11) * 0.7,
                    fy: 0.5 + seededRandom(s + 0.22) * 0.7,
                    px: seededRandom(s + 0.33) * Math.PI * 2,
                    py: seededRandom(s + 0.44) * Math.PI * 2,
                    amp: scale * (0.04 + seededRandom(s + 0.55) * 0.05)
                };
            }));

            data.p.forEach(pts=>{
                const path = document.createElementNS(SVG_NS, "path");
                path.setAttribute("d", smoothPath(pts));
                svg.appendChild(path);
                pathEls.push(path);
            });

            const entry = { paths: pathEls, basePts: data.p, phase, intensity: 0, target: 0 };
            wrap.addEventListener("mouseenter", ()=>{
                entry.target = 1;
                active.add(entry);
                ensureLoop();
            });
            wrap.addEventListener("mouseleave", ()=>{
                entry.target = 0;
                active.add(entry);
                ensureLoop();
            });

            wrap.appendChild(svg);
        } else {
            // fallback for any word without traced data — plain text
            wrap.textContent = word;
            wrap.style.fontFamily = '"ABC Favorit", monospace';
            wrap.style.fontSize = "clamp(38px, 6.6vw, 92px)";
            wrap.style.color = "var(--text)";
        }

        block.appendChild(wrap);
        block.appendChild(document.createTextNode(" "));
    });
}

// 03 Anti Type — a plain text-file panel where the description types
// itself out letter by letter, set in the real exported Anti-Type font
// (same .otf the tool itself exports), with a blinking cursor at the end.
// Clicking the text hands over the keyboard: the auto-typing stops and
// the panel becomes directly editable. The moment the visitor stops
// typing (a short pause with no input), the machine takes back over and
// keeps typing out the rest of the original text on its own, picking up
// exactly where it left off — click in again at any point to interrupt
// it again. Returns { start, stop } so the page-switching logic can
// (re)play the typing each time this page becomes active, and fully
// reset it when you leave.
function wrapAntiTypeWrite(block){
    const text = block.dataset.text;
    block.innerHTML = "";

    const panel = document.createElement("div");
    panel.className = "at-panel";

    const body = document.createElement("div");
    body.className = "at-body";
    const content = document.createElement("span");
    content.className = "at-content";
    const cursor = document.createElement("span");
    cursor.className = "at-cursor";
    cursor.textContent = "|";
    body.appendChild(content);
    body.appendChild(cursor);
    panel.appendChild(body);

    block.appendChild(panel);

    let timer     = null; // the auto-typing interval (initial or resumed)
    let idleTimer = null; // debounce: fires once the visitor pauses
    let i         = 0;    // how far into the original text the machine has gotten
    let editing   = false;
    const IDLE_DELAY = 1400; // ms of no input before the machine resumes

    function stopTyping(){
        if(timer){ clearInterval(timer); timer = null; }
    }

    function clearIdle(){
        if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    }

    // the machine resumes, appending the remaining original characters
    // after whatever the visitor left in the panel
    function resumeAuto(){
        editing = false;
        content.contentEditable = "false";
        cursor.style.display = "";
        stopTyping();
        timer = setInterval(()=>{
            if(i >= text.length){ stopTyping(); return; }
            content.appendChild(document.createTextNode(text[i]));
            i++;
        }, 130);
    }

    function scheduleResume(){
        clearIdle();
        idleTimer = setTimeout(resumeAuto, IDLE_DELAY);
    }

    function beginEditing(){
        clearIdle();
        if(editing) return;
        editing = true;
        stopTyping();
        cursor.style.display = "none";
        content.contentEditable = "true";
        content.spellcheck = false;
        content.focus();
        // caret at the end of whatever's already been typed, not the start
        const range = document.createRange();
        range.selectNodeContents(content);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
    }

    body.addEventListener("click", beginEditing);
    content.addEventListener("input", scheduleResume);

    function start(){
        clearIdle();
        stopTyping();
        editing = false;
        content.contentEditable = "false";
        cursor.style.display = "";
        content.textContent = "";
        i = 0;
        timer = setInterval(()=>{
            if(i >= text.length){ stopTyping(); return; }
            content.textContent += text[i];
            i++;
        }, 130);
    }

    function stop(){
        clearIdle();
        stopTyping();
    }

    return { start, stop };
}

// 04 Reading Loop — the text is chunked into phrase-length pieces (5-9
// words), scattered widely across a large virtual space. The reading
// auto-advances on a loop (every AUTO_DELAY ms the camera pans itself to
// the next piece, wrapping back to the first at the end); clicking the
// current piece jumps early and just resets that countdown, it doesn't
// fight the automatic advance. Returns { start, stop } — start() resets
// the camera to piece 0 and clears which pieces have been visited, same
// pattern as Anti Type's typing hooks.
function wrapCameraLinks(block){
    const raw = block.dataset.text.replace(/\s+/g, ' ').trim();
    const blockIdx = wrapCounter++;
    const words = raw.split(' ');

    // chunk into readable phrase-length pieces, seeded so it's stable
    const pieces = [];
    let wi = 0, gi = 0;
    while(wi < words.length){
        const size = 5 + Math.floor(seededRandom(blockIdx*1000 + gi) * 5); // 5–9
        pieces.push(words.slice(wi, wi + size).join(' '));
        wi += size;
        gi++;
    }
    // a trailing tiny leftover gets folded into the previous piece
    if(pieces.length > 1 && pieces[pieces.length - 1].split(' ').length < 3){
        const last = pieces.pop();
        pieces[pieces.length - 1] += ' ' + last;
    }

    block.innerHTML = "";
    const viewport = document.createElement("div");
    viewport.className = "rl-viewport";
    const world = document.createElement("div");
    world.className = "rl-world";
    viewport.appendChild(world);
    block.appendChild(viewport);

    const WORLD_W = 4400, WORLD_H = 2600;
    const cols = Math.ceil(Math.sqrt(pieces.length));
    const rows = Math.ceil(pieces.length / cols);
    const cellW = WORLD_W / cols, cellH = WORLD_H / rows;

    const items = pieces.map((txt, pi)=>{
        const el = document.createElement("span");
        el.className = "rl-piece";
        el.textContent = txt;

        const col = pi % cols, row = Math.floor(pi / cols);
        const seed = blockIdx*1000 + pi;
        const x = col*cellW + cellW*0.15 + seededRandom(seed + 0.1) * cellW*0.6;
        const y = row*cellH + cellH*0.15 + seededRandom(seed + 0.2) * cellH*0.6;

        el.style.left = x.toFixed(1) + "px";
        el.style.top  = y.toFixed(1) + "px";
        world.appendChild(el);
        return { el, x, y };
    });

    let current = 0;
    const visited = new Set();
    let autoTimer = null;
    const AUTO_DELAY = 2800; // ms between automatic advances

    function panTo(idx){
        const vp = viewport.getBoundingClientRect();
        const target = items[idx];
        const tx = vp.width/2 - target.x;
        const ty = vp.height/2 - target.y;
        world.style.transform = "translate(" + tx.toFixed(1) + "px, " + ty.toFixed(1) + "px)";
    }

    function setActive(idx){
        items.forEach((it, i)=>{
            it.el.classList.toggle("active", i === idx);
            it.el.classList.toggle("visited", i !== idx && visited.has(i));
        });
    }

    function clearAuto(){
        if(autoTimer){ clearTimeout(autoTimer); autoTimer = null; }
    }

    // the reading auto-advances on a loop; a manual click just jumps early
    // and resets the countdown, instead of fighting the automatic one
    function scheduleAuto(){
        clearAuto();
        autoTimer = setTimeout(()=>{
            activate((current + 1) % items.length);
        }, AUTO_DELAY);
    }

    function activate(idx){
        current = idx;
        visited.add(idx);
        panTo(idx);
        setActive(idx);
        scheduleAuto();
    }

    items.forEach((it, i)=>{
        it.el.addEventListener("click", ()=>{
            if(i !== current) return; // only the active piece is a live link
            activate((current + 1) % items.length); // last piece loops back to the first
        });
    });

    function start(){
        visited.clear();
        activate(0);
    }

    function stop(){
        clearAuto();
    }

    return { start, stop };
}

function renderReadingSystem(block){
    switch(block.dataset.style){
        case "floatboxes": wrapFloatBoxes(block); break;
        case "abstract-words": wrapAbstractWords(block); break;
        case "antitype-write": {
            const hooks = block.closest(".tool-page").dataset.idx;
            pageHooks[hooks] = wrapAntiTypeWrite(block);
            break;
        }
        case "camera-links": {
            const idx = block.closest(".tool-page").dataset.idx;
            pageHooks[idx] = wrapCameraLinks(block);
            break;
        }
    }
}

document.querySelectorAll(".tp-text").forEach(renderReadingSystem);

/* ------------------------------ */
/* PAGE SWITCHING — NEXT cycles through the 4 pages (looping from 04     */
/* back to 01), the left-hand index jumps straight to one, and GO TO      */
/* TOOL opens whichever tool the page currently on screen belongs to.     */
/* ------------------------------ */

const pages       = Array.from(document.querySelectorAll(".tool-page"));
const indexBtns   = Array.from(document.querySelectorAll(".index-num"));
let currentPage   = 0;

function showPage(idx){
    const prevPage = currentPage;
    currentPage = ((idx % pages.length) + pages.length) % pages.length;
    pages.forEach((p, i)=> p.classList.toggle("active", i === currentPage));
    indexBtns.forEach((b, i)=> b.classList.toggle("active", i === currentPage));
    // brown buttons/index on the light-background pages (white or green),
    // green-on-dark everywhere else
    document.body.classList.toggle("page-is-white",
        pages[currentPage].classList.contains("tp-float") ||
        pages[currentPage].classList.contains("tp-rl-camera")
    );

    // page-specific effects (e.g. Anti Type's typing animation) only run
    // while their own page is actually the one on screen — and only get
    // (re)started when you actually navigate to a different page, not on
    // a repeat click that lands on the page you're already viewing (that
    // used to reset Anti Type's typing/editing every time, even mid-edit).
    if(prevPage !== currentPage){
        if(pageHooks[prevPage]) pageHooks[prevPage].stop();
        if(pageHooks[currentPage]) pageHooks[currentPage].start();
    }
}

document.getElementById("btn-next").addEventListener("click", ()=>{
    showPage(currentPage + 1);
});

indexBtns.forEach(btn=>{
    btn.addEventListener("click", ()=> showPage(parseInt(btn.dataset.idx, 10)));
});

document.getElementById("btn-go-tool").addEventListener("click", ()=>{
    const p = pages[currentPage];
    openTool(p.dataset.toolSrc, p.dataset.toolName);
});

/* ------------------------------ */
/* TOOL OVERLAY */
/* ------------------------------ */

const toolOverlay      = document.getElementById("tool-overlay");
const toolOverlayFrame = document.getElementById("tool-overlay-iframe");
const antiTypeFrame    = document.getElementById("anti-type-iframe");
const toolOverlayTitle = document.getElementById("tool-overlay-title");
const ANTI_TYPE_SRC    = "tools/anti-ocr.html";

function openTool(src, name){
    if(src === ANTI_TYPE_SRC){
        // load it once, then just reveal it — never reload while switching
        // tools, so an in-progress run keeps going in the background
        if(!antiTypeFrame.dataset.loaded){
            antiTypeFrame.src = src;
            antiTypeFrame.dataset.loaded = "1";
        }
        antiTypeFrame.classList.add("show");
        // asking here, from a real click, works far more reliably across
        // browsers (Safari especially) than asking from inside the iframe
        if(typeof Notification !== "undefined" && Notification.permission === "default"){
            Notification.requestPermission();
        }
        clearAntiTypeUpdateFlag();
    } else {
        antiTypeFrame.classList.remove("show");
        // avoid reloading the iframe if this tool is already the one showing
        if(toolOverlayFrame.dataset.currentSrc !== src){
            toolOverlayFrame.src = src;
            toolOverlayFrame.dataset.currentSrc = src;
        }
    }

    toolOverlayTitle.textContent = name;
    toolOverlay.classList.add("show");
    document.getElementById("tool-guide-btn").disabled = false;
}

// entry point for the tool's own "how it works" guide — each tool page
// still owns its guide content/modal, this just asks the currently-visible
// iframe to open it
document.getElementById("tool-guide-btn").addEventListener("click", ()=>{
    const activeFrame = antiTypeFrame.classList.contains("show") ? antiTypeFrame : toolOverlayFrame;
    if(!activeFrame.contentWindow) return;
    activeFrame.contentWindow.postMessage({ type: "open-guide" }, location.origin);
});

/* Anti Type runs in the background (see above) and reports back here      */
/* when a word or font export finishes, via postMessage from its iframe.   */
/* We try an OS notification, but don't rely on it alone — Safari in       */
/* particular can silently withhold permission — so there's always a       */
/* visible fallback too: a flashed tab title, cleared the moment Anti      */
/* Type is reopened.                                                       */
const pageTitle = document.title;

function clearAntiTypeUpdateFlag(){
    document.title = pageTitle;
}

window.addEventListener("message", (event)=>{
    if(event.origin !== location.origin) return;
    if(!event.data || event.data.type !== "anti-type-done") return;

    const { title, body } = event.data;

    if(typeof Notification !== "undefined" && Notification.permission === "granted"){
        try { new Notification(title, { body }); } catch(e) {}
    }

    // visible fallback, always shown regardless of notification permission
    document.title = "● " + pageTitle;
});

window.addEventListener("focus", ()=>{
    if(antiTypeFrame.classList.contains("show")) clearAntiTypeUpdateFlag();
});

document.getElementById("tool-overlay-close").addEventListener("click", ()=>{
    toolOverlay.classList.remove("show");
    toolOverlayFrame.src = "";
    toolOverlayFrame.dataset.currentSrc = "";
});

</script>
